<!doctype html>
<html lang="de">
<head><base href="/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>STEWARO · E-Mail-Verbindung</title>
  <style>
    :root{color-scheme:light;--mail-bg:#f7f4ec;--mail-paper:#fffdf9;--mail-ink:#10271f;--mail-muted:#6b655c;--mail-gold:#a88d60;--mail-line:rgba(16,39,31,.13)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(820px 480px at 50% -100px,rgba(202,180,133,.20),transparent 70%),linear-gradient(180deg,#fbf9f4,var(--mail-bg));color:var(--mail-ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    .card{width:min(100%,520px);padding:clamp(28px,6vw,46px);border:1px solid var(--mail-line);border-radius:28px;background:rgba(255,253,249,.90);box-shadow:0 24px 70px rgba(48,40,27,.07);text-align:center}
    .card::before{content:"";display:block;width:42px;height:42px;margin:0 auto 22px;background:center/contain no-repeat url("/assets/logos/stewaro-icon.svg")}
    .eyebrow{font-size:11px;font-weight:760;letter-spacing:.18em;text-transform:uppercase;color:var(--mail-gold)}
    .title{margin:12px 0 14px;color:var(--mail-ink);font:400 clamp(30px,7vw,44px)/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
    .copy{margin:0;color:var(--mail-muted);line-height:1.65}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;margin-top:26px;padding:0 20px;border:1px solid var(--mail-ink);border-radius:999px;color:#fbf8f1;text-decoration:none;background:var(--mail-ink);font-weight:700}
    .btn:focus-visible{outline:3px solid rgba(168,141,96,.40);outline-offset:3px}
  </style>
  <script src="/assets/clean-url.js?v=1"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/stewaro-icon.svg?v=1" />
  <link rel="stylesheet" href="/assets/stewaro-client-portal-v2.css?v=1" />
</head>
<body class="stewaro-portal-surface stewaro-portal-email">
  <main class="card" aria-live="polite">
    <div class="eyebrow">STEWARO</div>
    <h1 class="title" id="title">E-Mail-Verbindung wird bestätigt …</h1>
    <p class="copy" id="copy">Bitte dieses Fenster nicht schließen.</p>
    <a class="btn" id="back" href="/konto#email" hidden>Zurück zum STEWARO-Konto</a>
  </main>
  <script>
    (()=>{
      const p=new URLSearchParams(location.search);
      const connected=p.get("email")==="connected"||p.get("integration")==="connected";
      const provider=String(p.get("provider")||"GOOGLE").toUpperCase();
      const flow=String(p.get("flow")||"CONNECT").toUpperCase();
      const safeProvider=["GOOGLE","MICROSOFT","YAHOO"].includes(provider)?provider:"GOOGLE";
      const safeFlow=flow==="REAUTH"?"REAUTH":"CONNECT";
      if(connected){
        location.replace(`/konto?email_oauth=complete&provider=${safeProvider}&flow=${safeFlow}&integration=connected#email`);
        return;
      }
      document.getElementById("title").textContent="E-Mail-Verbindung nicht abgeschlossen";
      document.getElementById("copy").textContent="Die Verbindung wurde nicht bestätigt. Kehre zum STEWARO-Konto zurück und versuche es dort erneut.";
      document.getElementById("back").hidden=false;
    })();
  </script>
</body>
</html>
