<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>NAHWERK · Verbunden</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;min-width:100%;height:100%;min-height:100%;margin:0;background:#000;color:#fff}
    body{min-height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    main{position:relative;display:grid;place-items:center;width:100%;min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 44%,rgba(214,169,71,.13),transparent 25%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 44%),#000}
    .card{position:relative;width:min(520px,100%);display:grid;justify-items:center;text-align:center}
    .logo-shell{position:relative;width:156px;height:156px;display:grid;place-items:center;margin:0 0 26px}
    .logo-shell:before{content:"";position:absolute;inset:18px;border-radius:50%;background:rgba(207,159,61,.12);filter:blur(24px)}
    .logo{position:relative;width:148px;height:148px;object-fit:contain;filter:brightness(1.09) saturate(1.06) drop-shadow(0 12px 42px rgba(203,153,54,.28))}
    .eyebrow{margin:0 0 9px;font-size:11px;line-height:1.2;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#b8b8bd}
    h1{margin:0;font-size:clamp(28px,5vw,40px);line-height:1.04;letter-spacing:-.035em;font-weight:680}
    .copy{max-width:430px;margin:14px 0 0;color:#a9a9af;font-size:14px;line-height:1.55}
    .state{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:8px 12px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(255,255,255,.035);color:#d8d8dc;font-size:12px}
    .dot{width:7px;height:7px;border-radius:50%;background:#d7ab52;box-shadow:0 0 12px rgba(215,171,82,.7);animation:pulse 1.1s ease-in-out infinite}
    .fallback{margin-top:18px;color:#737379;font-size:11px}
    .fallback a{color:#a8a8ae;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.16)}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.08)}}
    @media(max-width:560px){.logo-shell{width:132px;height:132px;margin-bottom:22px}.logo{width:126px;height:126px}.copy{font-size:13px}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <div class="logo-shell"><img class="logo" src="/assets/logos/NAHWERK-Goldmann-Transparent.webp" alt="NAHWERK"></div>
      <p class="eyebrow">NAHWERK Concierge</p>
      <h1 id="title">E-Mail verbunden</h1>
      <p class="copy" id="copy">Dein E-Mail-Konto wurde sicher mit NAHWERK verbunden.</p>
      <div class="state"><span class="dot" aria-hidden="true"></span><span>Du wirst zurück zu NAHWERK geleitet</span></div>
      <p class="fallback">Falls nichts passiert: <a id="continueLink" href="/konto?email=connected">Zu NAHWERK</a></p>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const params = new URLSearchParams(location.search);
      const provider = String(params.get("provider") || "").toLowerCase();
      const workspace = params.get("workspace") === "1";
      const labels = { google:"Gmail", microsoft:workspace?"Microsoft 365":"Outlook", yahoo:"Yahoo Mail" };
      const label = labels[provider] || "E-Mail";
      const fallback = new URL("/konto", location.origin);
      fallback.searchParams.set("email","connected");
      fallback.searchParams.set("provider", provider || "email");
      let destination = fallback;
      const raw = params.get("return_to");
      if (raw) {
        try {
          const candidate = new URL(raw, location.origin);
          if (candidate.origin === location.origin || candidate.origin === "https://www.nahwerkconcierge.com" || candidate.origin === "https://nahwerkconcierge.com") destination = candidate;
        } catch {}
      }
      document.getElementById("title").textContent = workspace ? "Arbeitsbereich verbunden" : "E-Mail verbunden";
      document.getElementById("copy").textContent = label + " wurde sicher mit deinem NAHWERK " + (workspace ? "Concierge" : "E-Mail-Concierge") + " verbunden.";
      const link = document.getElementById("continueLink");
      link.href = destination.toString();
      setTimeout(() => location.replace(destination.toString()), 1600);
    })();
  </script>
</body>
</html>
