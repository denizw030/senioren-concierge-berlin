<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <title>Yahoo wird mit NAHWERK verbunden</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f4f4f4;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(560px,calc(100% - 40px));padding:34px;border:1px solid #292929;border-radius:22px;background:#0a0a0a}
    h1{margin:0 0 10px;font-size:26px;letter-spacing:-.03em}
    p{margin:0;color:#b8b8b8}
    .brand{margin-bottom:18px;color:#d8bd73;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  </style>
  <script src="/assets/clean-url.js?v=1"></script>
</head>
<body>
  <main>
    <div class="brand">NAHWERK Concierge</div>
    <h1>Yahoo wird mit NAHWERK verbunden.</h1>
    <p id="status">Die sichere Verbindung wird abgeschlossen …</p>
  </main>
  <script>
    (() => {
      'use strict';
      const backend = 'https://djicahhmnnamtjuqedqd.supabase.co/functions/v1/nahwerk-email-runtime/email/oauth/yahoo/callback';
      const allowed = ['code','state','error','error_description','error_uri'];
      const incoming = new URLSearchParams(window.location.search);
      const outgoing = new URLSearchParams();
      for (const key of allowed) {
        const value = incoming.get(key);
        if (value !== null) outgoing.set(key, value);
      }
      const hasSuccess = outgoing.has('code') && outgoing.has('state');
      const hasProviderError = outgoing.has('error') && outgoing.has('state');
      if (!hasSuccess && !hasProviderError) {
        document.getElementById('status').textContent = 'Die Yahoo-Antwort ist unvollständig. Bitte starte die Verbindung erneut im NAHWERK Kundenkonto.';
        return;
      }
      window.location.replace(backend + '?' + outgoing.toString());
    })();
  </script>
</body>
</html>
