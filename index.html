<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="canonical" href="https://stewaro.com/de/">
  <script>
    // A handoff is valid only on the exact HTTPS product origin, never on an
    // HTTP, non-default-port or lookalike host. All other hosts are public.
    const isApp = window.location.origin === "https://app.stewaro.com";
    const safeAnchor = isApp
      ? (/^#handoff=hnd_[A-Za-z0-9_-]{40,120}$/.test(window.location.hash)
          ? window.location.hash : "")
      : (/^#(?:top|start|services|for-you|family|contact)$/.test(window.location.hash)
          ? window.location.hash : "");
    // Never forward auth/OAuth tokens or arbitrary queries through either
    // public marketing or the product redirect. Keep bounded attribution only.
    const safeParams = new URLSearchParams();
    if (window.location.search.length <= 2048) {
      try {
        for (const [key, value] of new URLSearchParams(window.location.search)) {
          if (/^(?:utm_(?:source|medium|campaign|content|term|id)|src|ref|campaign|gclid|fbclid|msclkid)$/i.test(key)
              && value.length <= 200 && !/[\x00-\x1f\x7f]/.test(value)) {
            safeParams.append(key, value);
          }
        }
      } catch (_) { /* Invalid query: fail closed. */ }
    }
    const query = safeParams.toString();
    const target = isApp ? "/web-concierge" : "/de/";
    window.location.replace(target + (query ? "?" + query : "") + safeAnchor);
  </script>
  <title>STEWARO</title>
</head>
<body>
  <a href="https://stewaro.com/de/">Weiter zu STEWARO</a>
</body>
</html>
