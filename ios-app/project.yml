name: NAHWERK

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: "$(NAHWERK_IOS_BUNDLE_ID)"
    DEVELOPMENT_TEAM: "$(NAHWERK_IOS_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic

targets:
  NAHWERK:
    type: application
    platform: iOS
    sources:
      - path: NAHWERK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NAHWERK
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES\n        INFOPLIST_KEY_NSMicrophoneUsageDescription: "NAHWERK benötigt das Mikrofon, damit du deinem Concierge eine Sprachmemo senden kannst."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    postBuildScripts:
      - name: Verify and copy canonical NAHWERK coin
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SOURCE_DIR="$SRCROOT/../android-app/app/src/main/splash-reference"
          OUT_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          OUT="$OUT_DIR/nahwerk_brand_coin.webp"
          EXPECTED="40d81ef0f53c31a48cc9ca2ec2ca8dfca2ead41c897aa0c1a673ddac43a980a3"
          test -d "$SOURCE_DIR"
          mkdir -p "$OUT_DIR"
          cat "$SOURCE_DIR"/nahwerk_brand_coin.b64.part* | tr -d '\n\r ' | /usr/bin/base64 -D > "$OUT"
          ACTUAL="$(/usr/bin/shasum -a 256 "$OUT" | /usr/bin/awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

  NAHWERKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NAHWERKTests
    dependencies:
      - target: NAHWERK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NAHWERK_IOS_BUNDLE_ID).tests"

  NAHWERKUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NAHWERKUITests
    dependencies:
      - target: NAHWERK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NAHWERK_IOS_BUNDLE_ID).uitests"

schemes:
  NAHWERK:
    build:
      targets:
        NAHWERK: all
        NAHWERKTests: [test]
        NAHWERKUITests: [test]
    test:
      targets:
        - NAHWERKTests
        - NAHWERKUITests
