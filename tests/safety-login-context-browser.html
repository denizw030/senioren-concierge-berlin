<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safety login context browser regression</title>
  <style>iframe{width:100%;height:900px;border:0}</style>
</head>
<body>
  <div id="status" role="status">RUNNING</div>
  <iframe id="target" title="STEWARO context test"></iframe>
  <script>
    (() => {
      const frame = document.getElementById("target");
      const status = document.getElementById("status");
      const PRODUCT_KEY = "nahwerk_product";
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const nextLoad = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      const assert = (condition, message) => { if (!condition) throw new Error(message); };

      async function open(path, storedProduct) {
        sessionStorage.clear();
        if (storedProduct) sessionStorage.setItem(PRODUCT_KEY, storedProduct);
        const loaded = nextLoad();
        frame.src = `${path}${path.includes("?") ? "&" : "?"}context_test=${Date.now()}`;
        await loaded;
        await wait(250);
        return frame.contentDocument;
      }

      function isLoginPath() {
        return /\/anmelden(?:\.html)?\/?$/.test(frame.contentWindow.location.pathname);
      }

      function isAccountEntryPath() {
        return /\/zugang(?:\.html)?\/?$/.test(frame.contentWindow.location.pathname);
      }

      function assertAccountEntry(doc, label) {
        assert(isAccountEntryPath(), `${label}: not on unified STEWARO account entry`);
        assert(doc.querySelector("[data-stewaro-access]"), `${label}: unified account entry missing`);
      }

      function assertPrimeLogin(doc, label) {
        assert(isLoginPath(), `${label}: not on login page`);
        assert(doc.body.dataset.product === "prime", `${label}: body product is not prime`);
        assert(!doc.body.classList.contains("senior-product"), `${label}: senior theme class leaked`);
      }

      function assertSeniorLogin(doc, label) {
        assert(isLoginPath(), `${label}: not on login page`);
        assert(doc.body.dataset.product === "senioren", `${label}: body product is not senioren`);
        assert(doc.body.classList.contains("senior-product"), `${label}: senior theme class missing`);
      }

      async function clickAndWait(link) {
        const loaded = nextLoad();
        link.click();
        await loaded;
        await wait(250);
        return frame.contentDocument;
      }

      // The candidate Account portal is a different origin. Do not iframe-navigate
      // into the live public hostname: enforce its exact HTTPS destination instead.
      // Continue exercising the real login/theme DOM for local same-origin fallbacks.
      async function assertClientAreaTransition(link, label, expectedProduct) {
        const from = frame.contentWindow.location;
        const target = new URL(link.href, from.href);
        const local = target.origin === from.origin;
        const account = target.origin === "https://account.stewaro.com";
        assert(local || account, `${label}: unexpected account destination origin`);
        assert(["/", "/zugang", "/anmelden", "/registrieren"].includes(target.pathname),
          `${label}: unexpected account route`);
        if (account) return;
        const doc = await clickAndWait(link);
        if (isAccountEntryPath()) return assertAccountEntry(doc, label);
        if (isLoginPath()) {
          return expectedProduct === "senioren"
            ? assertSeniorLogin(doc, label)
            : assertPrimeLogin(doc, label);
        }
        throw new Error(`${label}: not on account entry or login`);
      }

      async function run() {
        let doc = await open("/safety.html", null);
        let links = [...doc.querySelectorAll("a")].filter((a) => a.textContent.trim() === "Zum Klientenbereich");
        assert(links.length === 2, "fresh Safety: expected two client-area links");
        await assertClientAreaTransition(links[links.length - 1], "fresh Safety", "prime");

        doc = await open("/safety.html", "senioren");
        links = [...doc.querySelectorAll("a")].filter((a) => a.textContent.trim() === "Zum Klientenbereich");
        assert(links.length === 2, "stale Senior Safety: expected two client-area links");
        await assertClientAreaTransition(links[links.length - 1], "stale Senior Safety", "prime");

        doc = await open("/senioren-concierge.html", null);
        let login = doc.querySelector("a.login-link");
        assert(login, "Senior page: login link missing");
        await assertClientAreaTransition(login, "Senior page", "senioren");

        doc = await open("/prime-concierge.html", "senioren");
        login = doc.querySelector("a.login-link");
        assert(login, "Prime page: login link missing");
        await assertClientAreaTransition(login, "Prime page", "prime");

        doc = await open("/anmelden.html?produkt=prime", "senioren");
        assertPrimeLogin(doc, "direct Prime login");

        doc = await open("/anmelden.html?produkt=senioren", "prime");
        assertSeniorLogin(doc, "direct Senior login");

        document.documentElement.dataset.safetyLoginContext = "green";
        status.textContent = "SAFETY_LOGIN_CONTEXT_BROWSER=GREEN";
      }

      run().catch((error) => {
        document.documentElement.dataset.safetyLoginContext = "red";
        status.textContent = `SAFETY_LOGIN_CONTEXT_BROWSER=RED ${error.message}`;
      });
    })();
  </script>
</body>
</html>
