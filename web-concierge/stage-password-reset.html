<body>
  <main class="stage-recovery">
    <p class="stage-recovery__eyebrow">STEWARO · GESCHÜTZTE TESTUMGEBUNG</p>
    <h1>Testpasswort ändern</h1>
    <p>Nur für das separate STAGING-Testkonto. Verwende kein echtes STEWARO-Passwort.</p>

      <input id="stageNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <label for="stageConfirmPassword">Testpasswort wiederholen</label>
      <input id="stageConfirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <button id="stageSavePassword" type="submit">Neues Testpasswort speichern</button>
    </form>
    <a href="/web-concierge/?stage_verify=20261020b">Zurück zur STAGING-Anmeldung</a>
    <p class="stage-recovery__note">Keine Telefonate, Klientendaten oder Live-Gespräche möglich.</p>
