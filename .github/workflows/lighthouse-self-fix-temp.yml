name: Lighthouse Self Fix TEMP

on:
  push:
    branches:
      - fix/website-ci-localized-home-20260915

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-ci-localized-home-20260915
          fetch-depth: 0
      - name: Align Lighthouse with current Chrome generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/acquisition-v1-ci.yml')
          s=p.read_text(encoding='utf-8')
          old='lighthouse@12.8.2'
          new='lighthouse@13.4.1'
          count=s.count(old)
          if count != 8:
              raise SystemExit(f'expected 8 Lighthouse pins, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm -f .github/workflows/lighthouse-self-fix-temp.yml
          git diff --check
      - name: Commit branch-only CI toolchain repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: align Lighthouse with current Chrome"
          git push origin HEAD:fix/website-ci-localized-home-20260915
