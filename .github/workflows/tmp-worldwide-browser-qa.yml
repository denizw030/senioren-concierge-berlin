name: Temporary worldwide browser QA
on:
  push:
    branches:
      - fix/nahwerk-weltweit-navigation-rename-final-20260910
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nahwerk-weltweit-navigation-rename-final-20260910
      - name: Apply exact runtime navigation label correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/auth-nav.js')
          text = path.read_text(encoding='utf-8')
          old = '["concierges.html", "Concierges"]'
          new = '["concierges.html", "NAHWERK weltweit"]'
          count = text.count(old)
          print(f'RUNTIME_NAV_OLD_COUNT={count}')
          if count != 1:
              raise SystemExit(f'Expected exactly one runtime NAV label, got {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "assets/auth-nav.js"
          git diff --check
          git config user.name 'denizw030'
          git config user.email 'denizwnm@gmail.com'
          git add assets/auth-nav.js
          git commit -m 'Rename runtime worldwide navigation label'
          git push origin HEAD:fix/nahwerk-weltweit-navigation-rename-final-20260910
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Serve static preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/nahwerk-http.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/concierges.html', timeout=1) as r:
                      if r.status == 200: break
              except Exception:
                  time.sleep(.2)
          else:
              raise SystemExit('Local preview did not start')
          PY
      - name: Browser QA 1440 1366 1280 390 360
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          sizes = [(1440,900),(1366,768),(1280,800),(390,844),(360,800)]
          report, failures = [], 0
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width, height in sizes:
                  page = browser.new_page(viewport={'width': width, 'height': height})
                  console_errors, page_errors = [], []
                  page.on('console', lambda msg, bag=console_errors: bag.append(msg.text) if msg.type == 'error' else None)
                  page.on('pageerror', lambda exc, bag=page_errors: bag.append(str(exc)))
                  issues = []
                  try:
                      response = page.goto('http://127.0.0.1:4173/concierges.html', wait_until='networkidle')
                      if not response or response.status != 200: issues.append(f'http={response.status if response else None}')
                      if page.title() != 'NAHWERK weltweit | Internationale Verfügbarkeit': issues.append('title')
                      if page.locator('h1').first.inner_text().strip() != 'NAHWERK weltweit': issues.append('h1')
                      active = page.locator('a.active[href="concierges.html"]').first
                      if active.count() != 1 or active.inner_text().strip() != 'NAHWERK weltweit': issues.append('active_nav')
                      sw = page.evaluate('document.documentElement.scrollWidth')
                      cw = page.evaluate('document.documentElement.clientWidth')
                      if sw > cw: issues.append(f'overflow={sw}>{cw}')
                      if page_errors: issues.append('page_errors=' + repr(page_errors))
                      runtime_console = []
                      for error in console_errors:
                          local_analytics_cors = (
                              "from origin 'http://127.0.0.1:4173'" in error and
                              '/web-profile/analytics' in error and
                              'blocked by CORS policy' in error
                          )
                          if not local_analytics_cors and 'Failed to load resource' not in error:
                              runtime_console.append(error)
                      if runtime_console: issues.append('console=' + repr(runtime_console))
                  except Exception as exc:
                      issues.append('exception=' + repr(exc))
                  finally:
                      page.screenshot(path=f'qa-{width}.png', full_page=True)
                      page.close()
                  state = 'GREEN' if not issues else 'RED'
                  failures += bool(issues)
                  report.append(f'{width}x{height}: {state}' + ('' if not issues else ' | ' + ' | '.join(issues)))
              browser.close()
          Path('browser-qa.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          if failures:
              raise SystemExit(f'{failures} viewport(s) failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldwide-browser-qa-final
          path: |
            browser-qa.txt
            qa-1440.png
            qa-1366.png
            qa-1280.png
            qa-390.png
            qa-360.png
