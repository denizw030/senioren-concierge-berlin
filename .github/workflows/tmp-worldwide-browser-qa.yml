name: Temporary worldwide browser QA
on:
  push:
    branches:
      - fix/nahwerk-weltweit-navigation-rename-final-20260910
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static link and scope audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote

          root = Path('.')
          target = root / 'concierges.html'
          accidental = root / 'NAHWERK weltweit.html'
          assert target.is_file(), 'concierges.html missing'
          assert not accidental.exists(), 'accidental filename still exists'

          missing = []
          accidental_refs = []
          old_labels = []
          links = []

          class P(HTMLParser):
              def __init__(self, source):
                  super().__init__(convert_charrefs=True)
                  self.source = source
                  self.anchor = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'a': return
                  href = dict(attrs).get('href')
                  if href is not None: self.anchor = [href, []]
              def handle_data(self, data):
                  if self.anchor is not None: self.anchor[1].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() != 'a' or self.anchor is None: return
                  href, text_parts = self.anchor
                  text = ' '.join(''.join(text_parts).split())
                  links.append((self.source, href, text))
                  self.anchor = None

          html_files = sorted(root.rglob('*.html'))
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              P(str(p)).feed(text)
              if 'NAHWERK weltweit.html' in text:
                  accidental_refs.append(str(p))

          for source, href, text in links:
              parsed = urlsplit(href)
              if parsed.scheme or href.startswith('//') or href.startswith('#') or href.startswith('mailto:') or href.startswith('tel:') or href.startswith('javascript:'):
                  continue
              path = unquote(parsed.path)
              if not path: continue
              if path.endswith('.html'):
                  resolved = (Path(source).parent / path).resolve()
                  if not resolved.exists(): missing.append((source, href))
              if path == 'concierges.html' or path.endswith('/concierges.html'):
                  if text == 'Concierges': old_labels.append((source, href, text))

          target_links = [(s,h,t) for s,h,t in links if unquote(urlsplit(h).path).endswith('concierges.html')]
          print(f'HTML_FILES={len(html_files)}')
          print(f'TARGET_LINKS={len(target_links)}')
          print(f'OLD_EXACT_LABELS={len(old_labels)}')
          print(f'ACCIDENTAL_REFS={len(accidental_refs)}')
          print(f'MISSING_INTERNAL_HTML_TARGETS={len(missing)}')
          for row in missing: print('MISSING|' + '|'.join(row))
          assert not old_labels, old_labels
          assert not accidental_refs, accidental_refs
          assert not missing, missing
          PY
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Serve static preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/nahwerk-http.log 2>&1 &
          echo $! > /tmp/nahwerk-http.pid
          python - <<'PY'
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/concierges.html', timeout=1) as r:
                      assert r.status == 200
                      break
              except Exception:
                  import time; time.sleep(.2)
          else:
              raise SystemExit('Local preview did not start')
          PY
      - name: Browser QA 1440 1366 1280 390 360
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          sizes = [(1440,900),(1366,768),(1280,800),(390,844),(360,800)]
          report = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width, height in sizes:
                  page = browser.new_page(viewport={'width': width, 'height': height})
                  console_errors = []
                  page_errors = []
                  page.on('console', lambda msg, bag=console_errors: bag.append(msg.text) if msg.type == 'error' else None)
                  page.on('pageerror', lambda exc, bag=page_errors: bag.append(str(exc)))
                  response = page.goto('http://127.0.0.1:4173/concierges.html', wait_until='networkidle')
                  assert response and response.status == 200, f'{width}: HTTP status not 200'
                  assert page.title() == 'NAHWERK weltweit | Internationale Verfügbarkeit', (width, page.title())
                  assert page.locator('h1').first.inner_text().strip() == 'NAHWERK weltweit', width
                  active = page.locator('a.active[href="concierges.html"]').first
                  assert active.count() == 1 and active.inner_text().strip() == 'NAHWERK weltweit', width
                  overflow = page.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth')
                  assert not overflow, f'{width}: horizontal overflow'
                  assert not page_errors, f'{width}: page errors {page_errors}'
                  runtime_console = [e for e in console_errors if 'Failed to load resource' not in e]
                  assert not runtime_console, f'{width}: console errors {runtime_console}'
                  page.screenshot(path=f'qa-{width}.png', full_page=True)
                  report.append(f'{width}x{height}: GREEN | overflow=false | page_errors=0 | runtime_console_errors=0')
                  page.close()
              browser.close()
          Path('browser-qa.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worldwide-browser-qa
          path: |
            browser-qa.txt
            qa-1440.png
            qa-1366.png
            qa-1280.png
            qa-390.png
            qa-360.png
