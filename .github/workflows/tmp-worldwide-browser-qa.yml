name: Temporary worldwide browser QA
on:
  push:
    branches:
      - fix/nahwerk-weltweit-navigation-rename-final-20260910
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Serve static preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/nahwerk-http.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/concierges.html', timeout=1) as r:
                      if r.status == 200: break
              except Exception:
                  time.sleep(.2)
          else:
              raise SystemExit('Local preview did not start')
          PY
      - name: Browser QA with exact diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          sizes = [(1440,900),(1366,768),(1280,800),(390,844),(360,800)]
          report = []
          failures = 0
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width, height in sizes:
                  page = browser.new_page(viewport={'width': width, 'height': height})
                  console_errors, page_errors = [], []
                  page.on('console', lambda msg, bag=console_errors: bag.append(msg.text) if msg.type == 'error' else None)
                  page.on('pageerror', lambda exc, bag=page_errors: bag.append(str(exc)))
                  issues = []
                  try:
                      response = page.goto('http://127.0.0.1:4173/concierges.html', wait_until='networkidle')
                      if not response or response.status != 200: issues.append(f'http={response.status if response else None}')
                      title = page.title()
                      if title != 'NAHWERK weltweit | Internationale Verfügbarkeit': issues.append(f'title={title!r}')
                      h1 = page.locator('h1').first.inner_text().strip()
                      if h1 != 'NAHWERK weltweit': issues.append(f'h1={h1!r}')
                      active = page.locator('a.active[href="concierges.html"]').first
                      if active.count() != 1: issues.append(f'active_count={active.count()}')
                      else:
                          active_text = active.inner_text().strip()
                          if active_text != 'NAHWERK weltweit': issues.append(f'active_text={active_text!r}')
                      sw = page.evaluate('document.documentElement.scrollWidth')
                      cw = page.evaluate('document.documentElement.clientWidth')
                      if sw > cw: issues.append(f'overflow={sw}>{cw}')
                      if page_errors: issues.append('page_errors=' + repr(page_errors))
                      runtime_console = [e for e in console_errors if 'Failed to load resource' not in e]
                      if runtime_console: issues.append('console=' + repr(runtime_console))
                  except Exception as exc:
                      issues.append('exception=' + repr(exc))
                  finally:
                      try: page.screenshot(path=f'qa-{width}.png', full_page=True)
                      except Exception as exc: issues.append('screenshot=' + repr(exc))
                      page.close()
                  state = 'GREEN' if not issues else 'RED'
                  if issues: failures += 1
                  report.append(f'{width}x{height}: {state}' + ('' if not issues else ' | ' + ' | '.join(issues)))
              browser.close()
          Path('browser-qa.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          if failures:
              raise SystemExit(f'{failures} viewport(s) failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldwide-browser-qa-diagnostic
          path: |
            browser-qa.txt
            qa-1440.png
            qa-1366.png
            qa-1280.png
            qa-390.png
            qa-360.png
