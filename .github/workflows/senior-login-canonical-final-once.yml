name: senior login canonical final once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/senior-login-canonical-final-once.yml'

permissions:
  contents: write

concurrency:
  group: senior-login-canonical-final-main
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install canonical senior login CSS
        shell: bash
        run: |
          cat > assets/senior-login-canonical-20260915.css <<'CSS'
          /* Canonical Senioren login layout. This file is intentionally unique to bypass stale CDN/browser CSS. */
          @media (min-width:821px){
            html body.login-image-page.senior-product main,
            html body.login-image-page[data-product="senioren"] main{
              position:relative!important;
              display:block!important;
              width:100%!important;
              max-width:none!important;
              min-height:calc(100vh - 126px)!important;
              margin:0!important;
              padding:0!important;
              overflow:hidden!important;
              background:#f7f3ea!important;
              isolation:isolate!important;
            }

            html body.login-image-page.senior-product main::before,
            html body.login-image-page[data-product="senioren"] main::before{
              content:""!important;
              position:absolute!important;
              z-index:0!important;
              inset:0 50% 0 0!important;
              margin:0!important;
              border:0!important;
              background:radial-gradient(700px 520px at 92% 20%,rgba(200,164,93,.15),transparent 66%),radial-gradient(540px 400px at 8% 10%,rgba(255,255,255,.86),transparent 66%),linear-gradient(145deg,#fbf8f1 0%,#f3eddf 62%,#eadfca 100%)!important;
            }

            html body.login-image-page.senior-product main::after,
            html body.login-image-page[data-product="senioren"] main::after{
              content:""!important;
              position:absolute!important;
              z-index:1!important;
              inset:0 0 0 50%!important;
              display:block!important;
              margin:0!important;
              padding:0!important;
              border:0!important;
              border-radius:0!important;
              background:#e8dfd2 url("/assets/lifestyle/senior-woman-overview.webp?v=6") 70% 50%/cover no-repeat!important;
              box-shadow:none!important;
            }

            html body.login-image-page.senior-product main>.hero,
            html body.login-image-page.senior-product main>.section,
            html body.login-image-page[data-product="senioren"] main>.hero,
            html body.login-image-page[data-product="senioren"] main>.section{
              position:relative!important;
              z-index:2!important;
              display:block!important;
              float:none!important;
              clear:both!important;
              width:50%!important;
              max-width:50%!important;
              min-width:0!important;
              margin:0!important;
              box-sizing:border-box!important;
              background:transparent!important;
              border:0!important;
              overflow:visible!important;
              contain:none!important;
              content-visibility:visible!important;
            }

            html body.login-image-page.senior-product main>.hero,
            html body.login-image-page[data-product="senioren"] main>.hero{
              min-height:0!important;
              padding:clamp(48px,5vw,72px) clamp(38px,5vw,72px) 0!important;
            }

            html body.login-image-page.senior-product main>.section,
            html body.login-image-page[data-product="senioren"] main>.section{
              min-height:0!important;
              padding:26px clamp(38px,5vw,72px) clamp(48px,5vw,72px)!important;
            }

            html body.login-image-page.senior-product main>.hero::before,
            html body.login-image-page.senior-product main>.hero::after,
            html body.login-image-page[data-product="senioren"] main>.hero::before,
            html body.login-image-page[data-product="senioren"] main>.hero::after{
              content:none!important;
              display:none!important;
            }

            html body.login-image-page.senior-product main>.hero>.wrap,
            html body.login-image-page.senior-product main>.section>.wrap,
            html body.login-image-page.senior-product .loginwrap,
            html body.login-image-page[data-product="senioren"] main>.hero>.wrap,
            html body.login-image-page[data-product="senioren"] main>.section>.wrap,
            html body.login-image-page[data-product="senioren"] .loginwrap{
              display:block!important;
              width:100%!important;
              max-width:560px!important;
              min-width:0!important;
              margin:0 auto!important;
              padding:0!important;
              padding-left:0!important;
              padding-right:0!important;
              box-sizing:border-box!important;
            }

            html body.login-image-page.senior-product main>.hero>.wrap>.eyebrow,
            html body.login-image-page.senior-product main>.hero>.wrap>h1,
            html body.login-image-page.senior-product main>.hero>.wrap>p,
            html body.login-image-page[data-product="senioren"] main>.hero>.wrap>.eyebrow,
            html body.login-image-page[data-product="senioren"] main>.hero>.wrap>h1,
            html body.login-image-page[data-product="senioren"] main>.hero>.wrap>p{
              display:block!important;
              width:100%!important;
              min-width:100%!important;
              max-width:100%!important;
              inline-size:100%!important;
              max-inline-size:100%!important;
              box-sizing:border-box!important;
              padding-left:0!important;
              padding-right:0!important;
              white-space:normal!important;
              word-break:normal!important;
              overflow-wrap:normal!important;
            }

            html body.login-image-page.senior-product main>.hero>.wrap>p,
            html body.login-image-page[data-product="senioren"] main>.hero>.wrap>p{
              margin:0!important;
              font-size:clamp(.98rem,1.05vw,1.08rem)!important;
              line-height:1.56!important;
              color:#655f55!important;
            }

            html body.login-image-page.senior-product .logincard,
            html body.login-image-page[data-product="senioren"] .logincard{
              display:block!important;
              width:100%!important;
              max-width:none!important;
              min-width:0!important;
              margin:0!important;
              padding:26px!important;
              box-sizing:border-box!important;
              border:1px solid rgba(112,87,39,.14)!important;
              border-radius:20px!important;
              background:rgba(255,255,255,.94)!important;
              color:#181713!important;
              box-shadow:0 18px 48px rgba(65,49,22,.10),inset 0 1px 0 rgba(255,255,255,.96)!important;
            }
          }

          @media (max-width:820px){
            html body.login-image-page.senior-product main,
            html body.login-image-page[data-product="senioren"] main{
              overflow:visible!important;
              min-height:0!important;
            }
            html body.login-image-page.senior-product main>.hero,
            html body.login-image-page.senior-product main>.section,
            html body.login-image-page[data-product="senioren"] main>.hero,
            html body.login-image-page[data-product="senioren"] main>.section{
              width:100%!important;
              max-width:100%!important;
            }
            html body.login-image-page.senior-product main>.hero>.wrap,
            html body.login-image-page.senior-product main>.section>.wrap,
            html body.login-image-page[data-product="senioren"] main>.hero>.wrap,
            html body.login-image-page[data-product="senioren"] main>.section>.wrap{
              width:100%!important;
              max-width:560px!important;
              padding:0!important;
            }
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          p = Path('anmelden.html')
          s = p.read_text()
          link = '<link rel="stylesheet" href="/assets/senior-login-canonical-20260915.css?v=1">'
          if link not in s:
              anchor = '<link rel="stylesheet" href="/assets/senior-login-final-v1.css?v=3">'
              if anchor not in s:
                  raise SystemExit('senior login anchor stylesheet not found')
              s = s.replace(anchor, anchor + link, 1)
          p.write_text(s)
          PY

      - name: Validate isolated result
        shell: bash
        run: |
          grep -q 'senior-login-canonical-20260915.css?v=1' anmelden.html
          grep -q 'min-width:100%!important' assets/senior-login-canonical-20260915.css
          grep -q 'main::after' assets/senior-login-canonical-20260915.css
          git diff --check

      - name: Publish without overwriting concurrent work
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anmelden.html assets/senior-login-canonical-20260915.css
          git commit -m 'Make senior login layout canonical and cache-safe'
          git pull --rebase origin main
          git push origin HEAD:main
