name: Credential Staging Security Tests
on:
  push:
    branches: [design/nahwerk-credential-staging-security-01]
  pull_request:
    branches: [main]
    paths:
      - credential_security_core.py
      - test_credential_security_core.py
      - CREDENTIAL-STAGING-SECURITY.md
      - .github/workflows/credential-staging-security-tests.yml
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 70 isolated security tests
        run: python -m unittest -v test_credential_security_core.py
