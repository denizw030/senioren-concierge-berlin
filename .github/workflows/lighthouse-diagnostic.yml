name: Lighthouse Diagnostic
on:
  push:
    branches:
      - feat/website-story-conversion-final-20260910
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Serve preview
        run: |
          nohup python3 -m http.server 4173 >/tmp/nw-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
      - name: Run all Lighthouse reports
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/index.html --quiet --chrome-flags="--headless --no-sandbox" --preset=desktop --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-desktop.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/index.html --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-mobile.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/telefonannahme.html --quiet --chrome-flags="--headless --no-sandbox" --preset=desktop --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-telephone-desktop.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/telefonannahme.html --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-telephone-mobile.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('konto.html').read_text(encoding='utf-8')
          style=re.search(r'<style>[\s\S]*?</style>',src,re.I).group(0)
          links='\n'.join(re.findall(r'<link[^>]+rel="stylesheet"[^>]*>',src,re.I))
          tab=re.search(r'<button[^>]+id="accountTabEmail"[\s\S]*?</button>',src,re.I).group(0).replace('aria-selected="false"','aria-selected="true"')
          ps=src.index('<div class="account-panel-heading" data-account-panel="email"')
          pe=src.index('<div class="account-panel-heading" data-account-panel="usage"',ps)
          panel=re.sub(r'\s+hidden(?=[^>]*>)','',src[ps:pe].strip(),count=2)
          Path('__email-account-a11y.html').write_text(f'<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Mail-Konto</title>{links}{style}</head><body><main><section class="section account-section"><div class="wrap"><h1>E-Mail-Konto</h1><nav class="account-tabs" role="tablist" aria-label="Kundenbereich E-Mail">{tab}</nav><div class="dash">{panel}</div></div></section></main></body></html>',encoding='utf-8')
          start=src.index('<div id="familyOwnerPanelSlot"')
          end=src.index('<article class="card summary-card plan-summary"',start)
          family=re.sub(r'\s+hidden(?=[^>]*>)','',src[start:end],count=4)
          Path('__family-owner-a11y.html').write_text(f'<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personen & Zugänge</title>{links}{style}</head><body><main><section class="section account-section"><div class="wrap"><h1>Kundenbereich</h1><h2>Personen & Zugänge</h2><div class="dash">{family}</div></div></section></main></body></html>',encoding='utf-8')
          PY
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/__email-account-a11y.html --quiet --chrome-flags="--headless --no-sandbox" --preset=desktop --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-email-desktop.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/__email-account-a11y.html --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-email-mobile.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/__family-owner-a11y.html --quiet --chrome-flags="--headless --no-sandbox" --preset=desktop --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-family-desktop.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/__family-owner-a11y.html --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-family-mobile.json
      - name: Print exact floors and homepage mobile diagnostics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const reports=[['desktop','/tmp/lh-desktop.json'],['mobile','/tmp/lh-mobile.json'],['telephone-desktop','/tmp/lh-telephone-desktop.json'],['telephone-mobile','/tmp/lh-telephone-mobile.json'],['email-desktop','/tmp/lh-email-desktop.json'],['email-mobile','/tmp/lh-email-mobile.json'],['family-desktop','/tmp/lh-family-desktop.json'],['family-mobile','/tmp/lh-family-mobile.json']];
          console.log('=== EXACT QUALITY FLOORS ===');
          for(const [name,file] of reports){
            const r=JSON.parse(fs.readFileSync(file,'utf8'));
            const perf=r.categories.performance.score;
            const a11y=r.categories.accessibility.score;
            console.log(name,JSON.stringify({performance:perf,performance_floor:0.75,performance_delta:+(perf-0.75).toFixed(2),accessibility:a11y,accessibility_floor:0.90,accessibility_delta:+(a11y-0.90).toFixed(2)}));
          }
          const r=JSON.parse(fs.readFileSync('/tmp/lh-mobile.json','utf8'));
          console.log('=== HOMEPAGE MOBILE METRICS ===');
          for(const id of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift']){
            const a=r.audits[id]; if(a) console.log(id,JSON.stringify({score:a.score,numericValue:a.numericValue,displayValue:a.displayValue}));
          }
          console.log('=== HOMEPAGE MOBILE NON-PASSING PERFORMANCE AUDITS ===');
          const rows=[];
          for(const [id,a] of Object.entries(r.audits)){
            if(a && a.scoreDisplayMode==='numeric' && typeof a.score==='number' && a.score<1){
              rows.push({id,title:a.title,score:a.score,displayValue:a.displayValue||'',savingsMs:a.details?.overallSavingsMs||0,savingsBytes:a.details?.overallSavingsBytes||0});
            }
          }
          rows.sort((a,b)=>(b.savingsMs-a.savingsMs)||(b.savingsBytes-a.savingsBytes)||(a.score-b.score));
          for(const row of rows.slice(0,30)) console.log(JSON.stringify(row));
          console.log('=== LCP / IMAGE DETAILS ===');
          for(const id of ['largest-contentful-paint-element','lcp-discovery-insight','lcp-phases-insight','image-delivery-insight','uses-responsive-images','uses-optimized-images','render-blocking-resources','render-blocking-insight','network-requests']){
            const a=r.audits[id]; if(!a) continue;
            console.log('AUDIT',id,JSON.stringify({score:a.score,displayValue:a.displayValue,details:a.details},null,2));
          }
          NODE
