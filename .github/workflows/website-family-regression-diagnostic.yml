name: Website Family Regression Diagnostic

on:
  push:
    branches:
      - "diagnostic/website-family-regression-proof-20260910"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c529db6d86dabb1e5c82ccccb6a76828cdf7187
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture website family regression
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee website-family-regression.log
      - name: Upload website family regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-family-regression-log
          path: website-family-regression.log
          if-no-files-found: error
