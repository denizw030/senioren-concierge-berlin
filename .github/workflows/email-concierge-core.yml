name: Email Concierge Core
on:
  push:
    branches: [design/nahwerk-email-concierge-core-01]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 40 email concierge tests
        run: node --test test/email-concierge.test.js
