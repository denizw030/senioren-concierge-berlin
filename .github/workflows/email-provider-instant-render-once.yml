name: E-Mail provider instant render one-time

on:
  push:
    branches:
      - fix/email-provider-instant-render-20260916

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check assets/email-provider-logo-connect-v3.js
      - name: Instant render and CSS contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('assets/email-provider-logo-connect-v3.js').read_text(encoding='utf-8')
          css = Path('assets/email-provider-logo-connect-v3.css').read_text(encoding='utf-8')
          assert js.count('{ id: "') >= 11
          init = js.rfind('ensureShell();')
          initial_render = js.find('renderGrid();', init)
          refresh = js.find('void refresh()', init)
          assert init >= 0 and initial_render > init and refresh > initial_render
          assert 'Promise.all([api("/email/provider-catalog"), api("/email/provider-connections")])' in js
          assert '@import' not in css
          for mark in ['email-provider-logo--gmail::before','email-provider-logo--microsoft::before','email-provider-logo--yahoo::before','email-provider-logo--telekom::before','email-provider-logo--zoho::before']:
              assert mark in css, mark
          print('EMAIL_PROVIDER_INSTANT_RENDER=GREEN')
          PY
