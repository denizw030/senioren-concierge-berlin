name: NAHWERK Anmelden Fold Proof

on:
  push:
    branches:
      - fix/anmelden-hero-fold-final-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build browser harness
        shell: bash
        run: |
          cat > anmelden-fold-harness.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold proof</title></head>
          <body style="margin:0;background:#111">
          <iframe id="page" style="position:fixed;inset:0;width:100vw;height:100vh;border:0"></iframe>
          <pre id="report" style="display:none"></pre>
          <script>
          (()=>{
            const q=new URLSearchParams(location.search);
            const product=q.get('product')||'prime';
            const frame=document.getElementById('page');
            const report=document.getElementById('report');
            const out={product,checks:{},metrics:{},errors:[]};
            const pass=(name,value,detail='')=>{out.checks[name]=!!value;if(!value)out.errors.push(name+(detail?': '+detail:''));};
            const rgb=s=>{const m=String(s).match(/rgba?\((\d+)\D+(\d+)\D+(\d+)/);return m?[+m[1],+m[2],+m[3]]:null};
            const lum=c=>{const v=c.map(x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*v[0]+.7152*v[1]+.0722*v[2]};
            const contrast=(a,b)=>{a=rgb(a);b=rgb(b);if(!a||!b)return 99;const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
            frame.addEventListener('load',()=>setTimeout(async()=>{
              try{
                const w=frame.contentWindow,d=w.document;
                const body=d.body,root=d.documentElement,header=d.querySelector('header.top'),main=d.querySelector('main'),hero=d.querySelector('.hero'),h1=d.querySelector('.hero h1'),desc=d.querySelector('.hero p'),form=d.getElementById('loginForm'),email=d.getElementById('loginEmail'),pwd=d.getElementById('loginPassword'),eye=d.querySelector('[data-password-toggle="loginPassword"]'),submit=d.getElementById('loginSubmit'),forgot=d.getElementById('forgotPassword'),status=d.getElementById('loginStatus'),register=d.querySelector('.logincard a[href^="registrieren.html"]'),nav=d.querySelector('nav.links');
                const vr={w:w.innerWidth,h:w.innerHeight};
                const fr=form.getBoundingClientRect(),hr=header.getBoundingClientRect(),h1r=h1.getBoundingClientRect(),dr=desc.getBoundingClientRect(),sr=submit.getBoundingClientRect();
                out.metrics={viewport:vr,headerBottom:hr.bottom,formTop:fr.top,formBottom:fr.bottom,h1Top:h1r.top,h1Font:parseFloat(w.getComputedStyle(h1).fontSize),docScrollWidth:root.scrollWidth,mainDisplay:w.getComputedStyle(main).display,gridColumns:w.getComputedStyle(main).gridTemplateColumns};
                pass('no_horizontal_overflow',root.scrollWidth<=vr.w+1,`${root.scrollWidth}>${vr.w}`);
                pass('eye_toggle_present',!!eye);
                const before=pwd.type;eye.click();const after=pwd.type;eye.click();pass('eye_toggle_works',before==='password'&&after==='text'&&pwd.type==='password',`${before}/${after}/${pwd.type}`);
                pass('login_touch_target',sr.height>=44,`height=${sr.height}`);
                pass('form_order',fr.top>dr.bottom,`formTop=${fr.top},descBottom=${dr.bottom}`);
                pass('heading_compact',parseFloat(w.getComputedStyle(h1).fontSize)<=70,`font=${w.getComputedStyle(h1).fontSize}`);
                pass('nav_present',!!nav);
                pass('description_contrast',contrast(w.getComputedStyle(desc).color,w.getComputedStyle(main).backgroundColor)>=4.5,`ratio=${contrast(w.getComputedStyle(desc).color,w.getComputedStyle(main).backgroundColor)}`);
                pass('label_contrast',contrast(w.getComputedStyle(d.querySelector('label[for="loginEmail"]')).color,w.getComputedStyle(form).backgroundColor)>=4.5,'');
                if(product==='prime'){
                  pass('prime_context',body.dataset.product==='prime'&&!body.classList.contains('senior-product'),`data=${body.dataset.product}`);
                  const pseudo=vr.w>900?w.getComputedStyle(main,'::after'):w.getComputedStyle(hero,'::after');
                  pass('red_blue_hero_asset',pseudo.backgroundImage.includes('nahwerk-red-blue-hero-web-lossless.webp'),pseudo.backgroundImage);
                  pass('hero_visible',pseudo.display!=='none'&&pseudo.content!=='none',`display=${pseudo.display},content=${pseudo.content}`);
                  if(vr.w>900){
                    pass('desktop_two_columns',w.getComputedStyle(main).display==='grid'&&w.getComputedStyle(main).gridTemplateColumns.split(' ').length>=2,w.getComputedStyle(main).gridTemplateColumns);
                    pass('desktop_form_above_fold',fr.bottom<=vr.h+1,`bottom=${fr.bottom},height=${vr.h}`);
                    pass('desktop_header_above_content',h1r.top>=hr.bottom,`h1Top=${h1r.top},headerBottom=${hr.bottom}`);
                  }
                  pass('register_link',!!register&&register.href.includes('registrieren.html'),register?.href||'missing');
                }else{
                  pass('senior_context',body.dataset.product==='senioren'&&body.classList.contains('senior-product'),`data=${body.dataset.product},class=${body.className}`);
                  pass('senior_not_prime_grid',vr.w<=900||w.getComputedStyle(main).display!=='grid',w.getComputedStyle(main).display);
                }

                forgot.click();
                await new Promise(r=>setTimeout(r,50));
                pass('forgot_handler',status.style.display==='block'&&status.textContent.includes('E-Mail-Adresse'),status.textContent);

                let captured=null;
                w.fetch=async(url,opts={})=>{captured={url:String(url),method:String(opts.method||'GET'),body:String(opts.body||'')};return new w.Response(JSON.stringify({status:'invalid_credentials'}),{status:401,headers:{'Content-Type':'application/json'}})};
                email.value='fold-proof@example.com';pwd.value='not-a-real-password';
                form.dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
                await new Promise(r=>setTimeout(r,120));
                pass('login_handler',!!captured&&captured.url.includes('web-login-secure')&&captured.method==='POST'&&captured.body.includes('fold-proof@example.com'),JSON.stringify(captured));

                document.documentElement.dataset.result=out.errors.length?'red':'green';
              }catch(e){out.errors.push(String(e&&e.stack||e));document.documentElement.dataset.result='red'}
              report.textContent=JSON.stringify(out,null,2);
              report.style.display='block';
              frame.style.display='none';
            },1200));
            frame.src='anmelden.html?produkt='+encodeURIComponent(product);
          })();
          </script>
          </body></html>
          EOF

      - name: Serve repository
        run: |
          nohup python3 -m http.server 4173 >/tmp/nw-login-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:4173/anmelden.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/anmelden.html >/dev/null

      - name: Chromium fold and interaction proof
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p proof
          run_case(){
            name="$1"; width="$2"; height="$3"; product="$4"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$width,$height" --virtual-time-budget=5000 --dump-dom \
              "http://127.0.0.1:4173/anmelden-fold-harness.html?product=$product&case=$name" > "proof/$name-dom.html"
            grep -q 'data-result="green"' "proof/$name-dom.html" || { echo "CASE $name RED"; cat "proof/$name-dom.html"; exit 1; }
            echo "CASE $name GREEN"
          }
          run_case prime-1440x900 1440 900 prime
          run_case prime-1366x768 1366 768 prime
          run_case prime-1280x800 1280 800 prime
          run_case prime-390x844 390 844 prime
          run_case prime-360x800 360 800 prime
          run_case senior-1440x900 1440 900 senioren

      - name: Capture final-layout screenshots
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          for spec in "1440x900 1440 900" "1366x768 1366 768" "1280x800 1280 800" "390x844 390 844" "360x800 360 800"; do
            set -- $spec
            name="$1"; width="$2"; height="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size="$width,$height" --virtual-time-budget=3500 \
              --screenshot="proof/anmelden-prime-$name.png" "http://127.0.0.1:4173/anmelden.html?produkt=prime"
          done

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: anmelden-fold-proof
          path: proof/
          if-no-files-found: error
