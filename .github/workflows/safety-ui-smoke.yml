name: NAHWERK Safety UI Smoke

on:
  push:
    branches: [main]
    paths:
      - "konto.html"
      - "tests/account-usage.test.mjs"
      - ".github/workflows/safety-ui-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify safety account UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("konto.html").read_text(encoding="utf-8")

          # Old wheel is fully gone.
          for stale in ("safetyTimePicker","safetyHourWheel","safetyMinuteWheel","setSafetyWheelTime","buildSafetyTimeWheel"):
              assert stale not in html, stale

          # Normal modern time controls and full escalation settings.
          for marker in (
              'id="safetyTimeList"',
              'id="safetyAddTimeButton"',
              'input.type = "time"',
              'id="safetyCustomerDelay"',
              'id="safetyEmergencyDelay"',
              'id="safetyContactList"',
              'id="safetyAddContactButton"',
              'SAFETY_CONTACTS_URL',
              'customer_call_delay_minutes: customerDelay',
              'emergency_contact_delay_minutes: emergencyDelay',
              'höchstens 20 Sekunden',
              'höchstens 5 Versuche',
              'Bis zu 2 Kundenanrufe',
              'id="safetySummaryGrid"',
              'id="safetySummaryCalls"',
              'id="safetyChainEscalation"',
              'safety-panel{grid-column:1/-1!important;width:100%}',
              'id="safetyCustomerDelay" type="number" min="1" max="60" step="1" value="5"',
              'id="safetyEmergencyDelay" type="number" min="1" max="60" step="1" value="3"',
              'Mailbox',
              'safetyToggleLabel.textContent = enabled ? "Deaktivieren" : "Aktivieren"',
              'const enteredContacts = rawContacts.filter',
              'await saveSafetyContacts(token, previousContacts).catch',
          ):
              assert marker in html, marker

          assert 'höchstens 10 Versuche' not in html
          assert 'value="15" inputmode="numeric"' not in html
          assert 'data-safety-contact="name" type="text" autocomplete="name" maxlength="120" required' not in html
          assert 'data-safety-contact="phone" type="tel" autocomplete="tel" required' not in html

          # Usage is server-fed, separates channels, prioritizes remaining quota,
          # and never invents a zero when the consumption value is unavailable.
          assert 'Dialoge verbleibend' in html
          assert 'Dialoge im Tarif enthalten' in html
          assert 'Math.max(0, limit - used)' in html
          assert 'usage?.app_dialogues_used' in html
          assert 'usage?.whatsapp_dialogues_used' in html
          assert '50 Dialoge Kontingent' not in html
          assert '20 Dialoge Kontingent' not in html

          # Existing backend contract remains.
          assert 'const SAFETY_URL = "https://denizw.app.n8n.cloud/webhook/senioren-concierge/web/safety";' in html
          assert 'safety_enabled: safetyEnabled.checked' in html
          assert 'schedule_mode: "recurring"' in html

          # Inline JS syntax.
          scripts=[]
          pos=0
          while True:
              s=html.find("<script>",pos)
              if s<0: break
              e=html.find("</script>",s)
              assert e>=0
              scripts.append(html[s+8:e])
              pos=e+9
          Path("/tmp/konto-inline.js").write_text("\n".join(scripts),encoding="utf-8")
          print("SAFETY_UI_STATIC=GREEN")
          PY
          node --check /tmp/konto-inline.js
          node --test tests/account-usage.test.mjs
          node --test tests/auth-security.test.mjs
      - name: Verify safety contacts endpoint fails closed
        run: |
          code="$(curl -sS -o /tmp/safety-contacts.json -w '%{http_code}' https://djicahhmnnamtjuqedqd.supabase.co/functions/v1/web-safety-contacts)"
          test "$code" = "401"
          grep -q '"invalid_session"' /tmp/safety-contacts.json
          echo "SAFETY_CONTACTS_FAIL_CLOSED=GREEN"
