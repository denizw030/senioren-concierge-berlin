name: One-shot Correct Homepage Hero

on:
  push:
    branches:
      - fix/correct-homepage-hero-final-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate exact-motif production WebP and patch only hero references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          src = Path('assets/prime/nahwerk-hero-web-lossless.webp')
          dst = Path('assets/prime/nahwerk-hero-web-lossless-optimized-hq.webp')

          raw = src.read_bytes()
          assert len(raw) == 1_039_224, len(raw)
          assert hashlib.sha256(raw).hexdigest() == '75db5bcac7927e334bb8f60f09e8b1d082664a732a4c434ca526b97c8cadccc9'

          with Image.open(src) as im:
              assert im.size == (1916, 821), im.size
              rgb = im.convert('RGB')
              rgb.save(dst, 'WEBP', quality=95, method=6)

          with Image.open(dst) as out:
              assert out.size == (1916, 821), out.size
          assert dst.stat().st_size < 250_000, dst.stat().st_size

          old = 'assets/prime/prime-concierge-hero-luxury-monogram-v2.webp'
          new = 'assets/prime/nahwerk-hero-web-lossless-optimized-hq.webp'
          paths = [
              Path('index.html'),
              Path('tests/email-account-integration.test.mjs'),
              Path('tests/telephone-reception-product.test.mjs'),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, (str(path), count)
              path.write_text(text.replace(old, new), encoding='utf-8')
              total += count
          assert total == 3, total
          print(f'generated={dst} bytes={dst.stat().st_size} dims=1916x821')
          PY

      - name: Remove one-shot workflow from final branch diff
        run: rm .github/workflows/one-shot-correct-homepage-hero.yml

      - name: Commit exact minimal correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/prime/nahwerk-hero-web-lossless-optimized-hq.webp index.html tests/email-account-integration.test.mjs tests/telephone-reception-product.test.mjs .github/workflows/one-shot-correct-homepage-hero.yml
          git diff --cached --name-status
          git commit -m 'fix(homepage): use optimized correct hero motif'
          git push origin HEAD:fix/correct-homepage-hero-final-20260910
