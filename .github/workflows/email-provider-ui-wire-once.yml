name: Email Provider UI Wire Once

on:
  push:
    branches:
      - fix/email-provider-cards-clickable-20260916
    paths:
      - '.github/workflows/email-provider-ui-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate provider UI JavaScript
        run: |
          set -euo pipefail
          node --check assets/email-provider-ui-v2.js
          grep -q '/email/connect/manual' assets/email-provider-ui-v2.js
          grep -q '/email/provider/disconnect' assets/email-provider-ui-v2.js
          ! grep -q 'localStorage.*Password' assets/email-provider-ui-v2.js
          echo 'PROVIDER_UI_JS=GREEN'
      - name: Wire asset into account page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('konto.html')
          s=p.read_text()
          old='<script src="assets/email-account-integration.js?v=3"></script>'
          new=old+'\n  <script src="assets/email-provider-ui-v2.js?v=20260916-1"></script>'
          if new in s:
              print('PROVIDER_UI_ALREADY_WIRED=1')
          else:
              assert s.count(old)==1, 'email integration script anchor must exist exactly once'
              s=s.replace(old,new,1)
              p.write_text(s)
              print('PROVIDER_UI_WIRED=1')
          PY
          grep -q 'email-provider-ui-v2.js?v=20260916-1' konto.html
          git diff --check
      - name: Commit branch-only wiring
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'NO_BRANCH_CHANGE=1'
            exit 0
          fi
          git config user.name 'denizw030'
          git config user.email 'denizwnm@gmail.com'
          git add konto.html
          git commit -m 'fix(email): load multi-provider account UI'
          git push origin HEAD:fix/email-provider-cards-clickable-20260916
          echo 'ACCOUNT_PROVIDER_UI_WIRING=GREEN'
