name: PR94 optimize mobile hero once

on:
  push:
    branches:
      - "fix/website-ci-localized-home-20260915"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-ci-localized-home-20260915
          fetch-depth: 0
      - name: Switch canonical DE homepage to optimized mobile hero
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('de/index.html')
          text=path.read_text(encoding='utf-8')
          old='assets/prime/nahwerk-mobile-hero-web-lossless.webp?v=1'
          new='assets/prime/nahwerk-mobile-hero-web-optimized.webp?v=1'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one mobile hero reference, got {count}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de/index.html
          git commit -m "perf: serve optimized mobile homepage hero"
          git push origin HEAD:fix/website-ci-localized-home-20260915
