name: NAHWERK Security MFA Final Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-mfa-final-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/onboarding.js
          python - <<'PY'
          from pathlib import Path
          for source, target in [("konto.html","/tmp/konto-inline.js"),("anmelden.html","/tmp/anmelden-inline.js")]:
              page=Path(source).read_text(encoding="utf-8")
              scripts=[]
              start=0
              while True:
                  i=page.find("<script>",start)
                  if i<0: break
                  j=page.find("</script>",i)
                  if j<0: raise SystemExit("unterminated script in "+source)
                  scripts.append(page[i+8:j])
                  start=j+9
              Path(target).write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/konto-inline.js
          node --check /tmp/anmelden-inline.js
      - name: Run auth security regression tests
        run: node --test tests/auth-security.test.mjs
