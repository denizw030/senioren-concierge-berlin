name: legal i18n hardening

on:
  push:
    branches: [main]
    paths:
      - 'scripts/legal-i18n-hardening.py'
      - 'assets/legal-i18n.js'
      - 'tests/legal-i18n.test.mjs'
      - '.github/workflows/legal-i18n-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply legal locale hardening
        run: python scripts/legal-i18n-hardening.py
      - name: Verify legal and existing localization guards
        run: >-
          node --test
          tests/legal-i18n.test.mjs
          tests/i18n-completeness.test.mjs
          tests/i18n-link-flow.test.mjs
          tests/i18n-media-audit.test.mjs
          tests/seo-indexing.test.mjs
      - name: Validate diff
        run: git diff --check
      - name: Publish generated legal localization
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/auth-i18n.js assets/app-language-switcher.js assets/legal-i18n.js \
            impressum.html datenschutz.html agb.html widerruf.html ki-transparenz.html datenloeschung.html vertrag-widerrufen.html
          git commit -m "i18n: localize complete legal flow in EN and TR"
          git push origin HEAD:main
