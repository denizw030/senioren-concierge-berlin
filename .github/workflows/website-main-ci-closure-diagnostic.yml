name: Website Main CI Closure Diagnostic

on:
  push:
    branches:
      - fix/website-main-ci-closure-20260911
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node regression
        run: node --test tests/*.test.mjs
