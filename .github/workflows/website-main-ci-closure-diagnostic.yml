name: Website Main CI Closure Diagnostic

on:
  push:
    branches:
      - fix/website-main-ci-closure-20260911
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  common-failure-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: fix/website-main-ci-closure-20260911
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime drift guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          pr54_sha=$(git ls-remote origin refs/heads/fix/nahwerk-weltweit-navigation-rename-final-20260910 | awk '{print $1}')
          closure_sha=$(git ls-remote origin refs/heads/fix/website-main-ci-closure-20260911 | awk '{print $1}')
          test "$main_sha" = "5112c085938c0b892e7090442f03911a4b7f6131"
          test "$pr54_sha" = "a5c4d50edfdb5cc8433993c74cd586bcc173cea1"
          test "$closure_sha" = "$(git rev-parse HEAD)"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > /tmp/open-prs.json
          python - <<'PY'
          import json
          prs=json.load(open('/tmp/open-prs.json'))
          nums=sorted(p['number'] for p in prs)
          assert nums == [54], f'unexpected open PRs: {nums}'
          pr=prs[0]
          assert pr['head']['sha']=='a5c4d50edfdb5cc8433993c74cd586bcc173cea1'
          PY
      - name: Apply exact stale-copy expectation fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements={
            'tests/account-premium-ui.test.mjs':[
              ('Verwalten Sie unterstützte Personen und Zugriffsrechte','Verwalte unterstützte Personen und Zugriffsrechte',1),
              ('Personen, die Sie über NAHWERK unterstützen','Personen, die du über NAHWERK unterstützt',1),
            ],
            'tests/acquisition-v1.test.mjs':[
              ('Da sein, auch wenn Sie nicht da sein können','Da sein, auch wenn du gerade verhindert bist',1),
              ('First-Party-Produkt- und Funnel-Analyse','eigene, datensparsame Nutzungsanalyse',1),
            ],
            'tests/email-account-integration.test.mjs':[
              ('Die technische Verfügbarkeit hängt von den Einstellungen und Richtlinien Ihres E-Mail-Anbieters ab','Die technische Verfügbarkeit hängt von den Einstellungen und Richtlinien deines E-Mail-Anbieters ab',1),
              ('Die Verbindung gehört zu Ihrer Person','Die Verbindung gehört zu deiner Person',1),
              ('NAHWERK geht für Sie ans Telefon','NAHWERK geht für dich ans Telefon',1),
            ],
            'tests/story-conversion-final.test.mjs':[
              ('Da sein, auch wenn Sie nicht da sein können.','Da sein, auch wenn du gerade verhindert bist.',2),
              ('Geben Sie die erste Aufgabe ab.','Gib die erste Aufgabe ab.',1),
              ('Da sein, auch wenn Sie gerade verhindert sind','Da sein, auch wenn du gerade verhindert bist',1),
            ],
            'tests/telephone-reception-product.test.mjs':[
              ('NAHWERK geht für Sie ans Telefon','NAHWERK geht für dich ans Telefon',1),
            ],
          }
          for path, items in replacements.items():
            p=Path(path)
            text=p.read_text()
            for old,new,expected in items:
              count=text.count(old)
              assert count==expected, f'{path}: expected {expected} occurrence(s) of {old!r}, got {count}'
              text=text.replace(old,new)
            p.write_text(text)
          PY
          expected=$(printf '%s\n' \
            tests/account-premium-ui.test.mjs \
            tests/acquisition-v1.test.mjs \
            tests/email-account-integration.test.mjs \
            tests/story-conversion-final.test.mjs \
            tests/telephone-reception-product.test.mjs | sort)
          actual=$(git diff --name-only -- tests | sort)
          test "$actual" = "$expected"
          test -z "$(git diff --name-only -- '*.html' 'assets/*')"
      - name: Targeted ten-failure retest
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(context bar and access hierarchy use compact premium copy|homepage follows frozen story and keeps conversion reachable|first-party analytics is storage-minimal and disclosed|Generic APP_PASSWORD exact and TLS mandatory|channel continuity one person one core|mobile desktop plus prior regressions|homepage follows the frozen six-step story exactly|core marketing statements are preserved verbatim|safety remains calm, deliberate and bounded|telephone reception remains a separate product without invented prices)$'
          node --test --test-reporter=tap --test-name-pattern="$pattern" \
            tests/account-premium-ui.test.mjs \
            tests/acquisition-v1.test.mjs \
            tests/email-account-integration.test.mjs \
            tests/story-conversion-final.test.mjs \
            tests/telephone-reception-product.test.mjs > /tmp/targeted.txt 2>&1
          cat /tmp/targeted.txt
          grep -q '^# pass 10$' /tmp/targeted.txt
          grep -q '^# fail 0$' /tmp/targeted.txt
      - name: Full Node closure gate
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/*.test.mjs > /tmp/full.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '^# tests 173$' /tmp/full.txt
          grep -q '^# pass 171$' /tmp/full.txt
          grep -q '^# fail 2$' /tmp/full.txt
          grep -E '^[[:space:]]*not ok [0-9]+ - ' /tmp/full.txt > /tmp/fails.txt
          test "$(wc -l < /tmp/fails.txt | tr -d ' ')" = "2"
          grep -q 'local href and src targets exist' /tmp/fails.txt
          grep -q 'concierge world page starts with interactive region controls and no legacy full grid' /tmp/fails.txt
          cat /tmp/fails.txt
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/full.txt
      - name: Record proof and commit guarded fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo 'TARGETED COMMON FAILURES'
            grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/targeted.txt
            echo
            echo 'FULL NODE'
            cat /tmp/fails.txt
            grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/full.txt
          } > diagnostics/website-main-ci-closure-result.txt
          rm -f diagnostics/website-main-ci-node-output.txt diagnostics/website-main-ci-node-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/account-premium-ui.test.mjs tests/acquisition-v1.test.mjs tests/email-account-integration.test.mjs tests/story-conversion-final.test.mjs tests/telephone-reception-product.test.mjs diagnostics
          git commit -m "test: align canonical Du copy expectations [skip ci]"
      - name: Fresh post-commit full regression
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/*.test.mjs > /tmp/postcommit.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '^# tests 173$' /tmp/postcommit.txt
          grep -q '^# pass 171$' /tmp/postcommit.txt
          grep -q '^# fail 2$' /tmp/postcommit.txt
          grep -E '^[[:space:]]*not ok [0-9]+ - ' /tmp/postcommit.txt > /tmp/postfails.txt
          test "$(wc -l < /tmp/postfails.txt | tr -d ' ')" = "2"
          grep -q 'local href and src targets exist' /tmp/postfails.txt
          grep -q 'concierge world page starts with interactive region controls and no legacy full grid' /tmp/postfails.txt
      - name: Push closure commit
        shell: bash
        run: git push origin HEAD:fix/website-main-ci-closure-20260911
