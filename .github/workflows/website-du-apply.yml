            'Wenn Sie ausdrücklich verlangen, dass eine kostenpflichtige Dienstleistung bereits während der Widerrufsfrist beginnt, kann im Fall eines späteren Widerrufs für den bis zum Widerruf erbrachten Teil ein gesetzlich zulässiger anteiliger Betrag zu zahlen sein. Ein solcher vorzeitiger Beginn wird nur veranlasst, wenn die hierfür erforderlichen gesetzlichen Informationen und Erklärungen im Bestellprozess eingeholt wurden.':'Wenn du ausdrücklich verlangst, dass eine kostenpflichtige Dienstleistung bereits während der Widerrufsfrist beginnt, kann im Fall eines späteren Widerrufs für den bis zum Widerruf erbrachten Teil ein gesetzlich zulässiger anteiliger Betrag zu zahlen sein. Ein solcher vorzeitiger Beginn wird nur veranlasst, wenn die hierfür erforderlichen gesetzlichen Informationen und Erklärungen im Bestellprozess eingeholt wurden.',
            'Wenn Sie den Vertrag widerrufen wollen, können Sie folgende Angaben übermitteln:':'Wenn du den Vertrag widerrufen willst, kannst du folgende Angaben übermitteln:',
