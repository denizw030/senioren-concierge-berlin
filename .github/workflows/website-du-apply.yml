          }

          phrases=[
            ('Bitte übermitteln Sie','Bitte übermittle'),('Melden Sie sich','Melde dich'),('Wählen Sie','Wähle'),('Geben Sie','Gib'),('Sagen Sie','Sag'),('Nennen Sie','Nenne'),('Senden Sie','Sende'),('Beschreiben Sie','Beschreibe'),('Öffnen Sie','Öffne'),('Formulieren Sie','Formuliere'),('Nutzen Sie','Nutze'),('Prüfen und verwalten Sie','Prüfe und verwalte'),('Verwalten Sie','Verwalte'),('Passen Sie','Passe'),('Verbinden Sie','Verbinde'),('Bestätigen Sie','Bestätige'),('Scannen Sie','Scanne'),('Speichern Sie','Speichere'),
            ('Sie können','Du kannst'),('Sie schreiben','Du schreibst'),('Sie behalten','Du behältst'),('Sie erhalten','Du erhältst'),('Sie bestimmen','Du bestimmst'),('Sie geben','Du gibst'),('Sie sind','Du bist'),('Sie müssen','Du musst'),('Sie benötigen','Du benötigst'),('Sie möchten','Du möchtest'),('Sie entscheiden','Du entscheidest'),('Sie haben','Du hast'),
            ('können Sie','kannst du'),('möchten Sie','möchtest du'),('finden Sie','findest du'),('verwalten Sie','verwaltest du'),('öffnen Sie','öffnest du'),('gelangen Sie','gelangst du'),
            ('Wenn Sie','Wenn du'),('wenn Sie','wenn du'),('bevor Sie','bevor du'),('dass Sie','dass du'),('falls Sie','falls du'),
            ('für Sie selbst','für dich selbst'),('Für Sie selbst','Für dich selbst'),('für Sie','für dich'),('Für Sie','Für dich'),('bei Ihnen','bei dir'),('Bei Ihnen','Bei dir'),('mit Ihnen','mit dir'),('Mit Ihnen','Mit dir'),('zu Ihnen','zu dir'),('Zu Ihnen','Zu dir'),('von Ihnen','von dir'),('Von Ihnen','Von dir'),('Ihnen','dir')
          ]

          def rewrite(s):
              if s in exact: return exact[s]
              x=s
              for a,b in phrases:x=x.replace(a,b)
              for a,b in [('Ihres','deines'),('Ihrem','deinem'),('Ihren','deinen'),('Ihrer','deiner'),('Ihre','deine'),('Ihr','dein')]:x=x.replace(a,b)
              x=re.sub(r'\bSie\b','du',x)
              x=re.sub(r'(^|(?<=[.!?]\s))(du|dein|deine|deinen|deinem|deiner|deines)\b',lambda m:m.group(1)+m.group(2).capitalize(),x)
              return x

          changed=[]
          before={}
          for f in sorted(Path('.').glob('*.html')):
              name=f.name
              if name in protected_files:continue
              p=Audit(); raw=f.read_text(encoding='utf-8'); p.feed(raw); oldraw=raw
              seen=set()
              for old in p.matches:
                  if (name,old) in keep:continue
                  new=rewrite(old)
                  if old==new or (old,new) in seen:continue
                  seen.add((old,new))
                  if old not in raw:
                      print('MISSING EXACT CUSTOMER TEXT',name,repr(old));sys.exit(3)
                  raw=raw.replace(old,new)
              if raw!=oldraw:
                  before[name]=oldraw; f.write_text(raw,encoding='utf-8'); changed.append(name)

          # Explicit third-person/literal corrections after the general rewrite pass.
          corrections={
            'ablauf.html': [('Du oder du, kurze Antworten oder mehr Erklärung','Du oder Sie, kurze Antworten oder mehr Erklärung')],
            'angehoerige.html': [('du kann einfach in der Sprache schreiben oder sprechen, die für sie natürlich ist.','Sie kann einfach in der Sprache schreiben oder sprechen, die für sie natürlich ist.')],
            'index.html': [('du kann einfach in der Sprache schreiben oder sprechen, die für sie natürlich ist.','Sie kann einfach in der Sprache schreiben oder sprechen, die für sie natürlich ist.')],
            'ki-transparenz.html': [('du wird zugleich darüber informiert','Sie wird zugleich darüber informiert'),('du dürfen nicht als authentische Fotografie','Sie dürfen nicht als authentische Fotografie')],
            'concierge-anpassen.html': [('du sind nicht dafür gedacht','Sie sind nicht dafür gedacht'),('du – mit Anrede und Nachnamen','Sie – mit Anrede und Nachnamen')],
            'registrieren.html': [('du – mit Anrede und Nachnamen','Sie – mit Anrede und Nachnamen'),('Du-/du-Ansprache','Du-/Sie-Ansprache')],
            'konto.html': [('Deine E-Mail-Adresse bleibt für die bestehende Passwort-Wiederherstellung verfügbar. du wird nicht als gleichwertiger zweiter Faktor dargestellt.','Deine E-Mail-Adresse bleibt für die bestehende Passwort-Wiederherstellung verfügbar. Sie wird nicht als gleichwertiger zweiter Faktor dargestellt.')]
          }
          for name,pairs in corrections.items():
              p=Path(name)
              if not p.exists():continue
              raw=p.read_text(encoding='utf-8'); newer=raw
              for a,b in pairs:newer=newer.replace(a,b)
              if newer!=raw:
                  if name not in before:before[name]=raw;changed.append(name)
                  p.write_text(newer,encoding='utf-8')

          # No structural, JS, CSS or navigation mutation is allowed.
          attrs=re.compile(r'\b(?:id|class|href|src|data-[\w-]+|name|type|for|role|autocomplete|inputmode|pattern|maxlength|rel|property|aria-[\w-]+)\s*=\s*(?:"[^"]*"|\'[^\']*\')',re.I)
          scripts=re.compile(r'<script\b[^>]*>.*?</script\s*>',re.I|re.S)
          for name in set(changed):
              a=before[name]; b=Path(name).read_text(encoding='utf-8')
              if [m.group(0) for m in attrs.finditer(a)] != [m.group(0) for m in attrs.finditer(b)]:
                  print('STRUCTURAL ATTRIBUTE CHANGED',name);sys.exit(4)
              if scripts.findall(a)!=scripts.findall(b):
                  print('JAVASCRIPT CHANGED',name);sys.exit(5)
          if subprocess.run(['git','diff','--quiet','--','senioren-concierge.html','zugang-uebertragen.html']).returncode!=0:
              print('SENIOR EXPERIENCE CHANGED');sys.exit(6)
          bad=[n for n in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if not n.endswith('.html')]
          if bad:
              print('NON HTML PRODUCT CHANGE',bad);sys.exit(7)
          subprocess.run(['git','diff','--check'],check=True)

          required={
            'index.html':['NAHWERK | Dein persönlicher Concierge','Sag, was du brauchst.','miss NAHWERK daran, wie viel Arbeit es dir abnimmt.'],
            'anmelden.html':['Melde dich mit deiner E-Mail-Adresse','Wähle, wie du diese Anmeldung bestätigen möchtest.'],
            'registrieren.html':['Wer darf dich begleiten?','Für wen richtest du den Zugang ein?'],
            'konto.html':['Dein persönlicher Bereich.','Zum Deaktivieren bestätige dein aktuelles Passwort'],
            'safety.html':['Nur so viel Safety, wie du bewusst einrichtest.'],
            'telefonannahme.html':['NAHWERK geht für dich ans Telefon.','Morgens sagst du:'],
            'senioren-concierge.html':['Sie müssen keine Befehle oder Fachbegriffe kennen.']
          }
          for name,needles in required.items():
              t=Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in t:
                      print('REQUIRED COPY MISSING',name,needle);sys.exit(8)

          print('PRODUCT HTML CHANGED',sorted(set(changed)))
          if changed:
              subprocess.run(['git','config','user.name','NAHWERK Website Copy'],check=True)
              subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',*sorted(set(changed))],check=True)
              subprocess.run(['git','commit','-m','Switch general website customer address to Du'],check=True)
              subprocess.run(['git','push','origin',f'HEAD:{os.environ["GITHUB_REF_NAME"]}'],check=True)
          else:
              print('NO PRODUCT COPY CHANGES NEEDED')
          PY
