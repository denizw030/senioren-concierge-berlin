name: NAHWERK Website Du Copy Apply

on:
  push:
    branches:
      - fix/website-du-ansprache-final-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
