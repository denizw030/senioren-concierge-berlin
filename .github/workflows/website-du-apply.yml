        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, sys, os

          FORMAL=re.compile(r'\b(?:Sie|Ihnen|Ihr|Ihre|Ihren|Ihrem|Ihres|Ihrer)\b')
          EXCLUDED_TAGS={'script','style','template','svg','path'}
          VISIBLE_ATTRS={'placeholder','aria-label','title','alt','value'}

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.stack=[]; self.matches=[]
              def _attrs(self,tag,attrs):
                  a=dict(attrs)
                  for k,v in attrs:
                      if k in VISIBLE_ATTRS and v and FORMAL.search(v): self.matches.append(v.strip())
                  if tag=='meta' and (a.get('name','').lower() in {'description','twitter:description'} or a.get('property','').lower()=='og:description'):
                      v=a.get('content','')
                      if v and FORMAL.search(v): self.matches.append(v.strip())
              def handle_starttag(self,tag,attrs):
                  self.stack.append(tag)
                  if tag not in EXCLUDED_TAGS:self._attrs(tag,attrs)
              def handle_startendtag(self,tag,attrs):
                  if tag not in EXCLUDED_TAGS:self._attrs(tag,attrs)
              def handle_endtag(self,tag):
                  if self.stack:
                      if self.stack[-1]==tag:self.stack.pop()
                      elif tag in self.stack:self.stack=self.stack[:len(self.stack)-1-self.stack[::-1].index(tag)]
              def handle_data(self,data):
                  if any(t in EXCLUDED_TAGS for t in self.stack): return
                  t=' '.join(data.split())
                  if t and FORMAL.search(t): self.matches.append(t)

