name: Clean public URLs verify once

on:
  push:
    branches:
      - fix/clean-public-urls-20260919
    paths:
      - 'scripts/clean-url-postprocess.py'
      - '.github/workflows/clean-public-urls-verify-once.yml'

concurrency:
  group: clean-public-urls-verify-20260919
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize public URLs
        run: python scripts/clean-url-postprocess.py
      - name: Validate SEO, links and locale design parity
        run: node --test tests/seo-indexing.test.mjs tests/i18n-link-flow.test.mjs tests/i18n-design-parity.test.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit generated clean URLs
        run: |
          if git diff --quiet; then
            echo "No generated URL changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[clean-url-bot] normalize runtime order"
          git push origin HEAD:fix/clean-public-urls-20260919
