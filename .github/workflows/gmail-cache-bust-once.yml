name: Gmail account cache bust once

on:
  push:
    branches:
      - prod/gmail-cache-bust-20260915-1352
    paths:
      - '.github/workflows/gmail-cache-bust-once.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/gmail-cache-bust-20260915-1352
          fetch-depth: 0
      - name: Bump only Gmail account JS cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('konto.html')
          s = p.read_text()
          old = 'assets/email-account-integration.js?v=1'
          new = 'assets/email-account-integration.js?v=2'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Gmail script cache key, found {count}')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/gmail-cache-bust-once.yml').unlink()
          print('GMAIL_CACHE_BUST_V2=GREEN')
          PY
      - name: Commit isolated one-line result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add konto.html .github/workflows/gmail-cache-bust-once.yml
          git diff --cached --check
          git commit -m "Cache-bust Gmail PROD account adapter"
          git push origin HEAD:prod/gmail-cache-bust-20260915-1352
