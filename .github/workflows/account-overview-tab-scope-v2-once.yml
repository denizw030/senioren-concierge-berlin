name: account overview tab scope v2 once

on:
  push:
    branches:
      - fix/account-overview-tab-scope-v2-20260915
    paths:
      - .github/workflows/account-overview-tab-scope-v2-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-overview-tab-scope-v2-20260915
      - name: Scope overview cards and bust premium UI cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/account-premium-ui.css')
          css = css_path.read_text()
          rule = '''\n/* Account overview cards belong only to the overview tab. */\nbody.account-premium-ui .account-overview-highlights[hidden]{\n  display:none!important;\n}\n'''
          if 'body.account-premium-ui .account-overview-highlights[hidden]' not in css:
              css = css.rstrip() + '\n' + rule
              css_path.write_text(css)

          konto_path = Path('konto.html')
          konto = konto_path.read_text()
          old = 'assets/account-premium-ui.css?v=1'
          new = 'assets/account-premium-ui.css?v=2'
          if old in konto:
              konto = konto.replace(old, new, 1)
              konto_path.write_text(konto)
          elif new not in konto:
              raise SystemExit('account premium stylesheet cache key not found')

          assert 'body.account-premium-ui .account-overview-highlights[hidden]' in css_path.read_text()
          assert 'display:none!important' in css_path.read_text()
          assert new in konto_path.read_text()
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/account-overview-tab-scope-v2-once.yml
      - name: Commit isolated final UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/account-premium-ui.css konto.html .github/workflows/account-overview-tab-scope-v2-once.yml
          git diff --cached --check
          git commit -m "Fix account detail tabs showing overview cards"
          git push origin HEAD:fix/account-overview-tab-scope-v2-20260915
