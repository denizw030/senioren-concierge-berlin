name: A11y Diagnostic TEMP

on:
  push:
    branches:
      - fix/website-ci-localized-home-20260915

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact account accessibility fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path("konto.html").read_text(encoding="utf-8")
          style=re.search(r"<style>[\s\S]*?</style>",src,re.I).group(0)
          links="\n".join(re.findall(r'<link[^>]+rel="stylesheet"[^>]*>',src,re.I))
          tab=re.search(r'<button[^>]+id="accountTabEmail"[\s\S]*?</button>',src,re.I).group(0)
          tab=tab.replace('aria-selected="false"','aria-selected="true"')
          panel_start=src.index('<div class="account-panel-heading" data-account-panel="email"')
          panel_end=src.index('<div class="account-panel-heading" data-account-panel="usage"',panel_start)
          panel=src[panel_start:panel_end].strip()
          panel=re.sub(r'\s+hidden(?=[^>]*>)','',panel,count=2)
          email=f'''<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Mail-Konto | NAHWERK</title>{links}{style}</head><body><main><section class="section account-section"><div class="wrap"><h1>E-Mail-Konto</h1><nav class="account-tabs" role="tablist" aria-label="Kundenbereich E-Mail">{tab}</nav><div class="dash">{panel}</div></div></section></main></body></html>'''
          Path("__email-account-a11y.html").write_text(email,encoding="utf-8")

          start=src.index('<div id="familyOwnerPanelSlot"')
          end=src.index('<article class="card summary-card plan-summary"',start)
          panel=src[start:end]
          panel=re.sub(r'\s+hidden(?=[^>]*>)','',panel,count=4)
          family=f'''<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personen & Zugänge | NAHWERK</title>{links}{style}</head><body><main><section class="section account-section"><div class="wrap"><h1>Kundenbereich</h1><h2>Personen & Zugänge</h2><div class="dash">{panel}</div></div></section></main></body></html>'''
          Path("__family-owner-a11y.html").write_text(family,encoding="utf-8")
          PY
      - name: Serve static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nw-a11y-http.log 2>&1 &
          echo $! >/tmp/nw-a11y-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 0.5
          done
          exit 1
      - name: Install matching ChromeDriver
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_MAJOR="$("$CHROME" --version | grep -oE '[0-9]+' | head -1)"
          npx --yes browser-driver-manager@2.0.1 install "chrome@$CHROME_MAJOR"
      - name: Run axe diagnostics per page
        shell: bash
        run: |
          set -u
          set -a
          source "$HOME/.browser-driver-manager/.env"
          set +a
          test -x "$CHROMEDRIVER_TEST_PATH"
          mkdir -p /tmp/axe
          pages=(index.html prime-concierge.html safety.html registrieren.html angehoerige.html leistungen.html pakete.html telefonannahme.html __email-account-a11y.html __family-owner-a11y.html)
          : > /tmp/axe/summary.txt
          for page in "${pages[@]}"; do
            echo "===== $page =====" | tee -a /tmp/axe/summary.txt
            set +e
            npx --yes @axe-core/cli@4.10.2 --chromedriver-path "$CHROMEDRIVER_TEST_PATH" "http://127.0.0.1:4173/$page" > "/tmp/axe/${page//\//_}.txt" 2>&1
            rc=$?
            set -e
            echo "$page exit=$rc" | tee -a /tmp/axe/summary.txt
            cat "/tmp/axe/${page//\//_}.txt" >> /tmp/axe/summary.txt
          done
          cat /tmp/axe/summary.txt
      - name: Upload axe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-diagnostic-${{ github.sha }}
          path: /tmp/axe
          retention-days: 2
