name: Senior Login real panel v2

on:
  push:
    branches:
      - fix/senior-login-canonical-reset-20260915

permissions:
  contents: write

concurrency:
  group: senior-login-real-panel-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/senior-login-canonical-reset-20260915
          fetch-depth: 0

      - name: Replace pseudo image with real visual panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('anmelden.html')
          html = html_path.read_text(encoding='utf-8')
          visual = '<div class="senior-login-visual" aria-hidden="true"></div>'
          if visual not in html:
              if '</main>' not in html:
                  raise SystemExit('main closing tag missing')
              html = html.replace('</main>', visual + '</main>', 1)
              html_path.write_text(html, encoding='utf-8')

          css_path = Path('assets/senior-login-canonical-reset-20260915.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* NW SENIOR LOGIN REAL PANEL V2 */'
          if marker not in css:
              css += r'''

/* NW SENIOR LOGIN REAL PANEL V2 */
.senior-login-visual{
  display:none;
}

html.nw-product-senior-first-paint body.login-image-page main::after,
html body.login-image-page.senior-product main::after,
html body.login-image-page[data-product="senioren"] main::after{
  content:none!important;
  display:none!important;
}

html.nw-product-senior-first-paint body.login-image-page .senior-login-visual,
html body.login-image-page.senior-product .senior-login-visual,
html body.login-image-page[data-product="senioren"] .senior-login-visual{
  display:block!important;
  grid-column:2!important;
  grid-row:1 / -1!important;
  align-self:stretch!important;
  justify-self:stretch!important;
  position:relative!important;
  z-index:1!important;
  width:100%!important;
  min-width:0!important;
  height:100%!important;
  min-height:100%!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  background:#ddd4c8 url("/assets/lifestyle/senior-woman-overview.webp?v=6") 68% 50%/cover no-repeat!important;
  box-shadow:none!important;
  pointer-events:none!important;
}

@media (max-width:899px){
  html.nw-product-senior-first-paint body.login-image-page .senior-login-visual,
  html body.login-image-page.senior-product .senior-login-visual,
  html body.login-image-page[data-product="senioren"] .senior-login-visual{
    width:100%!important;
    height:clamp(360px,72vw,540px)!important;
    min-height:360px!important;
    margin:28px 0 0!important;
    background-position:68% 50%!important;
  }
}
'''
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate structural contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('anmelden.html').read_text(encoding='utf-8')
          css = Path('assets/senior-login-canonical-reset-20260915.css').read_text(encoding='utf-8')
          assert html.count('class="senior-login-visual"') == 1
          for token in (
              '/* NW SENIOR LOGIN REAL PANEL V2 */',
              'grid-column:2!important',
              'grid-row:1 / -1!important',
              'height:100%!important',
              '/cover no-repeat!important',
              'content:none!important',
          ):
              if token not in css:
                  raise SystemExit('missing token: ' + token)
          print('SENIOR_REAL_PANEL_STRUCTURE=GREEN')
          PY

      - name: Commit isolated repair
        shell: bash
        run: |
          if git diff --quiet -- anmelden.html assets/senior-login-canonical-reset-20260915.css; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name "nahwerk-prod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add anmelden.html assets/senior-login-canonical-reset-20260915.css
          git commit -m "senior login: replace pseudo image with real full-height panel"
          git push origin HEAD:fix/senior-login-canonical-reset-20260915
