name: NAHWERK Website Du Copy Safe Apply

on:
  push:
    branches:
      - fix/website-du-ansprache-final-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed Du copy without touching scripts or structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json, re, html, subprocess, os, sys

          DATA = ''''''
          mapping = json.loads(gzip.decompress(base64.b64decode(DATA)))
          protected = {'senioren-concierge.html','zugang-uebertragen.html'}

          block_re = re.compile(r'(?is)(<!--.*?-->|<script\b[^>]*>.*?</script\s*>|<style\b[^>]*>.*?</style\s*>|<template\b[^>]*>.*?</template\s*>|<[^>]+>)')
          attr_re = re.compile(r'(?i)(\b(?:placeholder|aria-label|title|alt|value)\s*=\s*)(["\'])(.*?)(\2)', re.S)
          meta_re = re.compile(r'(?is)^<meta\b')
          name_re = re.compile(r'(?i)\b(?:name|property)\s*=\s*(["\'])(.*?)\1')
          content_re = re.compile(r'(?i)(\bcontent\s*=\s*)(["\'])(.*?)(\2)', re.S)

          def norm(s):
              return ' '.join(html.unescape(s).split())

          def preserve_ws(raw, new):
              m1=re.match(r'^\s*',raw); m2=re.search(r'\s*$',raw)
              return raw[:m1.end()] + new + raw[m2.start():]

          changed=[]
          originals={}
          residual_candidates=[]

          for fname, rows in mapping.items():
              if fname in protected:
                  continue
              path=Path(fname)
              if not path.exists():
                  print('MISSING TARGET FILE',fname); sys.exit(2)
              raw=path.read_text(encoding='utf-8')
              originals[fname]=raw
              text_map={norm(old):new for old,new,kind in rows if kind=='text'}
              attr_map={norm(old):new for old,new,kind in rows if kind.startswith('attr:') or kind=='meta-description'}

              parts=[]; pos=0
              for m in block_re.finditer(raw):
                  data=raw[pos:m.start()]
                  key=norm(data)
                  if key in text_map:
                      data=preserve_ws(data,text_map[key])
                  parts.append(data)
                  token=m.group(0)
                  low=token.lstrip().lower()
                  if low.startswith('<script') or low.startswith('<style') or low.startswith('<template') or low.startswith('<!--'):
                      parts.append(token)
                  else:
                      def repl_attr(am):
                          val=am.group(3); key=norm(val)
                          if key not in attr_map: return am.group(0)
                          new=html.escape(attr_map[key],quote=True)
                          return am.group(1)+am.group(2)+new+am.group(4)
                      token=attr_re.sub(repl_attr,token)
                      if meta_re.match(token):
                          nm=name_re.search(token)
                          if nm and nm.group(2).lower() in {'description','twitter:description','og:description'}:
                              def repl_content(cm):
                                  val=cm.group(3); key=norm(val)
                                  if key not in attr_map:return cm.group(0)
                                  new=html.escape(attr_map[key],quote=True)
                                  return cm.group(1)+cm.group(2)+new+cm.group(4)
                              token=content_re.sub(repl_content,token)
                      parts.append(token)
                  pos=m.end()
              tail=raw[pos:]
              key=norm(tail)
              if key in text_map:
                  tail=preserve_ws(tail,text_map[key])
              parts.append(tail)
              out=''.join(parts)
              if out!=raw:
                  path.write_text(out,encoding='utf-8')
                  changed.append(fname)

          # Hard invariants: scripts/styles/templates/comments and structural attributes stay unchanged.
          structural_attrs={'id','class','href','src','data-product','data-target','data-step','data-action','name','type','for','role','autocomplete','inputmode','pattern','maxlength','rel','property'}
          tag_re=re.compile(r'(?is)<[^>]+>')
          any_attr_re=re.compile(r'(?is)\b([\w:-]+)\s*=\s*(["\'])(.*?)\2')
          frozen_block_re=re.compile(r'(?is)(<!--.*?-->|<script\b[^>]*>.*?</script\s*>|<style\b[^>]*>.*?</style\s*>|<template\b[^>]*>.*?</template\s*>)')

          for fname in changed:
              before=originals[fname]; after=Path(fname).read_text(encoding='utf-8')
              if frozen_block_re.findall(before)!=frozen_block_re.findall(after):
                  print('FROZEN BLOCK CHANGED',fname); sys.exit(3)
              def struct(doc):
                  out=[]
                  for tag in tag_re.findall(doc):
                      vals=[]
                      for a in any_attr_re.finditer(tag):
                          k=a.group(1).lower()
                          if k in structural_attrs or k.startswith('data-'):
                              vals.append((k,a.group(3)))
                      out.append((re.match(r'(?is)</?\s*([\w:-]+)',tag).group(1).lower() if re.match(r'(?is)</?\s*([\w:-]+)',tag) else '',tuple(vals)))
                  return out
              if struct(before)!=struct(after):
                  print('STRUCTURE OR LINK CHANGED',fname); sys.exit(4)

          for pf in protected:
              subprocess.run(['git','diff','--quiet','--',pf],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          bad=[p for p in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if p and not p.endswith('.html')]
          if bad:
              print('NON HTML PRODUCT CHANGE',bad);sys.exit(5)

          print('SAFE COPY FILES CHANGED',len(changed),sorted(changed))
          if changed:
              subprocess.run(['git','config','user.name','NAHWERK Website Copy'],check=True)
              subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',*sorted(changed)],check=True)
              subprocess.run(['git','commit','-m','Switch reviewed general website copy to Du'],check=True)
              subprocess.run(['git','push','origin',f'HEAD:{os.environ["GITHUB_REF_NAME"]}'],check=True)
          else:
              print('NO SAFE COPY CHANGES')
          PY
