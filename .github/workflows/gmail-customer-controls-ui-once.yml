name: Gmail Customer Controls UI Once

on:
  push:
    branches:
      - feat/gmail-customer-controls-prod-20260915
    paths:
      - '.github/workflows/gmail-customer-controls-ui-once.yml'

permissions:
  contents: write

concurrency:
  group: gmail-customer-controls-ui-once
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gmail-customer-controls-prod-20260915
          fetch-depth: 0

      - name: Apply isolated Gmail customer controls UI patch
        run: python .github/scripts/gmail-customer-controls-ui-v1.py

      - name: Preserve explicit send approval copy contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/email-account-integration.js')
          s=p.read_text()
          old='Dein Concierge nutzt nur die Funktionen, die du unten aktiviert hast. Senden bleibt zusätzlich an die vorgesehene Freigabe gebunden.'
          new='Dein Concierge nutzt nur die Funktionen, die du unten aktiviert hast und kann E-Mails nur nach der vorgesehenen Freigabe senden.'
          if s.count(old) != 1:
              raise SystemExit('approval copy target mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Run Gmail account integration tests
        run: node --test tests/email-account-integration.test.mjs

      - name: Guard diff and commit
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'konto.html',
            'assets/email-account-integration.js',
            'assets/email-account-integration.css',
            'tests/email-account-integration.test.mjs',
          }
          rows=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          changed={r[3:] for r in rows if len(r)>=4}
          if changed != allowed:
              raise SystemExit(f'unexpected diff: {sorted(changed)}')
          print('GMAIL_CUSTOMER_CONTROLS_UI_DIFF_GUARD=GREEN')
          PY
          git config user.name "NAHWERK Gmail UI Bot"
          git config user.email "denizwnm@gmail.com"
          git add konto.html assets/email-account-integration.js assets/email-account-integration.css tests/email-account-integration.test.mjs
          git commit -m "Gmail: add customer runtime controls"
          git push origin HEAD:feat/gmail-customer-controls-prod-20260915
