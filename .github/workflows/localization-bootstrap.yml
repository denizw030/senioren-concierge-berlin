name: Localization bootstrap PROD

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'de/**/*.html'
      - 'locales/*.json'
      - 'scripts/localization-bootstrap.py'
      - 'scripts/i18n-mirror.py'
      - 'scripts/i18n-home-routing.py'
      - 'scripts/auth-locale-bootstrap.py'
      - 'assets/language-switcher.js'
      - 'assets/app-language-switcher.js'
      - 'assets/auth-i18n.js'
      - 'assets/auth-slider-i18n.js'
      - 'assets/locale-runtime.js'
      - 'assets/onboarding.js'
      - 'assets/story-conversion-final.css'
      - 'tests/seo-indexing.test.mjs'
      - 'tests/i18n-design-parity.test.mjs'
      - 'tests/i18n-link-flow.test.mjs'
      - 'tests/i18n-completeness.test.mjs'
      - '.github/workflows/localization-bootstrap.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save root redirect before localization
        run: python scripts/i18n-home-routing.py save-root
      - name: Generate localized SEO seed and hreflang
        run: python scripts/localization-bootstrap.py
      - name: Use canonical German /de/ homepage as mirror source
        run: python scripts/i18n-home-routing.py use-de-source
      - name: Mirror exact PROD design and apply translations
        run: python scripts/i18n-mirror.py
      - name: Restore root redirect and persist German homepage updates
        run: python scripts/i18n-home-routing.py restore-root
      - name: Preserve language through registration and login
        run: python scripts/auth-locale-bootstrap.py
      - name: Validate SEO, visual parity, link flow and complete EN/TR localization
        run: node --test tests/seo-indexing.test.mjs tests/i18n-design-parity.test.mjs tests/i18n-link-flow.test.mjs tests/i18n-completeness.test.mjs
      - name: Validate clean diff
        run: git diff --check
      - name: Commit localization to PROD
        run: |
          if git diff --quiet; then
            echo 'No localization changes required.'
            exit 0
          fi
          git config user.name 'nahwerk-prod-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add de en tr sitemap.xml tests/seo-indexing.test.mjs *.html assets/onboarding.js
          git commit -m 'i18n: publish exact-design DE EN and TR pages'
          git push origin HEAD:main
