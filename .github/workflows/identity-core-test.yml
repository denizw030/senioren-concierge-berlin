name: Identity Core Test
on:
  push:
    branches: [design/nahwerk-identity-dedup-core-01]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test identity-core/identity-resolution.test.mjs
