name: ORFIDEL Preview V4 Cinematic

on:
  pull_request:
    branches: [main]
    paths:
      - 'orfidel-preview/**'
      - 'assets/orfidel-preview.css'
      - 'assets/orfidel-preview.js'
      - 'tests/orfidel-preview-v1.test.mjs'
      - '.github/workflows/orfidel-preview-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: ORFIDEL preview contract
        run: node --test tests/orfidel-preview-v1.test.mjs
      - name: No production route replacement
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD | tee /tmp/changed
          ! grep -Eq '^(index\.html|de/index\.html|konto\.html|konto/|web-concierge\.html|web-concierge/)' /tmp/changed
          echo ORFIDEL_PREVIEW_PROD_ISOLATION=GREEN
