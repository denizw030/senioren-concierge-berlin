name: Datenschutz Kundentext Production Proof

on:
  push:
    branches:
      - "qa/datenschutz-kundentext-prod-proof-20260910"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove text-only HTML structure and copy contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          before = subprocess.check_output([
              "git", "show", "6de37bcd2d0b2ef0dca8fa8a65cedb38e61daa4a:datenschutz.html"
          ], text=True)
          after = Path("datenschutz.html").read_text(encoding="utf-8")

          def tags(src):
              return re.findall(r"<[^>]+>", src)

          assert tags(before) == tags(after), "HTML tags/attributes changed; expected text-only change"

          required = [
              "Stand: 10. September 2026.",
              "Diese Datenschutzerklärung informiert darüber, wie personenbezogene Daten bei der Nutzung unserer Website und unserer Concierge-Dienste verarbeitet werden.",
              "Automatisierung und technische Verarbeitung",
              "Datenbank und persönlicher Nutzungskontext",
              "Hosting der Website",
              "Lokale Speicherung, Cookies und Nutzungsanalyse",
              "von dir freiwillig mitgeteilte Präferenzen",
              "wenn du sie aktiv an Nilo oder Mira sendest",
              "nur auf deine ausdrückliche Anfrage erstellt",
              "GitHub",
              "n8n",
              "Supabase",
              "Meta/WhatsApp",
              "OpenAI",
          ]
          forbidden = [
              "Diese Erklärung berücksichtigt den Betrieb über GitHub Pages, n8n, Supabase",
              "Automatisierung über n8n",
              "Datenbank und Kundengedächtnis über Supabase",
              "First-Party-Produkt- und Funnel-Analyse",
              "CTA-Nutzung",
              "technischen Orchestrierung",
              "lokale Aktivierungs-Ausgangswerte",
              "technisch klassifizieren oder an unterschiedliche Verarbeitungsschritte weiterleiten",
          ]
          for needle in required:
              assert needle in after, f"missing required copy: {needle}"
          for needle in forbidden:
              assert needle not in after, f"internal/developer copy still present: {needle}"
          print("TEXT-ONLY STRUCTURE GREEN")
          print("CUSTOMER COPY CONTRACT GREEN")
          print("PROVIDER TRANSPARENCY PRESERVED GREEN")
          PY

      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/datenschutz-http.log 2>&1 &
          echo $! > /tmp/datenschutz-http.pid
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:4173/datenschutz.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/datenschutz-http.log
          exit 1

      - name: Browser QA local and production desktop mobile
        run: |
          mkdir -p /tmp/datenschutz-proof
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const expected = 'Diese Datenschutzerklärung informiert darüber, wie personenbezogene Daten bei der Nutzung unserer Website und unserer Concierge-Dienste verarbeitet werden.';
          const forbidden = [
            'Diese Erklärung berücksichtigt den Betrieb über GitHub Pages, n8n, Supabase',
            'Automatisierung über n8n',
            'Datenbank und Kundengedächtnis über Supabase',
            'First-Party-Produkt- und Funnel-Analyse',
            'CTA-Nutzung',
            'technischen Orchestrierung',
            'lokale Aktivierungs-Ausgangswerte'
          ];
          const targets = [
            ['local', 'http://127.0.0.1:4173/datenschutz.html'],
            ['production', 'https://nahwerkconcierge.com/datenschutz.html']
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 900 }],
            ['mobile', { width: 390, height: 844 }]
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const [targetName, url] of targets) {
                for (const [viewportName, viewport] of viewports) {
                  const page = await browser.newPage({ viewport });
                  const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  if (!response || !response.ok()) throw new Error(`${targetName}/${viewportName}: HTTP ${response && response.status()}`);
                  await page.waitForSelector('h1', { state: 'visible', timeout: 10000 });
                  const text = await page.locator('body').innerText();
                  if (!text.includes(expected)) throw new Error(`${targetName}/${viewportName}: new notice not visible`);
                  for (const needle of forbidden) {
                    if (text.includes(needle)) throw new Error(`${targetName}/${viewportName}: forbidden copy visible: ${needle}`);
                  }
                  const metrics = await page.evaluate(() => ({
                    innerWidth: window.innerWidth,
                    scrollWidth: document.documentElement.scrollWidth,
                    h1: document.querySelector('h1')?.textContent?.trim(),
                    title: document.title
                  }));
                  if (metrics.scrollWidth > metrics.innerWidth + 2) {
                    throw new Error(`${targetName}/${viewportName}: horizontal overflow ${metrics.scrollWidth} > ${metrics.innerWidth}`);
                  }
                  if (metrics.h1 !== 'Datenschutzerklärung') throw new Error(`${targetName}/${viewportName}: H1 mismatch`);
                  if (metrics.title !== 'Datenschutz | NAHWERK Concierge') throw new Error(`${targetName}/${viewportName}: title mismatch`);
                  const shot = `/tmp/datenschutz-proof/${targetName}-${viewportName}.png`;
                  await page.screenshot({ path: shot, fullPage: true });
                  console.log(`${targetName.toUpperCase()} ${viewportName.toUpperCase()} GREEN`, JSON.stringify(metrics));
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datenschutz-kundentext-browser-proof
          path: /tmp/datenschutz-proof/*.png
          if-no-files-found: warn
