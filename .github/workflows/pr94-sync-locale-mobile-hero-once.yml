name: PR94 sync locale mobile hero once

on:
  push:
    branches:
      - "fix/website-ci-localized-home-20260915"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-ci-localized-home-20260915
          fetch-depth: 0
      - name: Keep EN and TR visual assets in parity with DE
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old='/assets/prime/nahwerk-mobile-hero-web-lossless.webp?v=1'
          new='/assets/prime/nahwerk-mobile-hero-web-optimized.webp?v=1'
          for file in ('en/index.html','tr/index.html'):
              path=Path(file)
              text=path.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{file}: expected exactly one old mobile hero reference, got {count}')
              path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/index.html tr/index.html
          git commit -m "perf: keep localized mobile heroes in parity"
          git push origin HEAD:fix/website-ci-localized-home-20260915
