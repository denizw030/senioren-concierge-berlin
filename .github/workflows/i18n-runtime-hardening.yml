name: i18n runtime hardening

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/i18n-runtime-hardening.py"
      - "tests/i18n-link-flow.test.mjs"
      - ".github/workflows/i18n-runtime-hardening.yml"

permissions:
  contents: write

concurrency:
  group: i18n-runtime-hardening-main
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply runtime hardening
        run: python scripts/i18n-runtime-hardening.py

      - name: Run localization and SEO guards
        run: >-
          node --test
          tests/i18n-runtime-hardening.test.mjs
          tests/i18n-completeness.test.mjs
          tests/i18n-design-parity.test.mjs
          tests/i18n-link-flow.test.mjs
          tests/seo-indexing.test.mjs

      - name: Validate diff
        run: git diff --check

      - name: Publish generated fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: eliminate mixed language flashes and broken localized assets"
          git push origin HEAD:main
