name: STEWARO scroll video live QA

on:
  push:
    branches:
      - main
    paths:
      - "de/index.html"
      - "en/index.html"
      - "tr/index.html"
      - ".github/workflows/stewaro-scroll-video-live-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-scroll-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployed STEWARO scroll-video source
        shell: bash
        run: |
          set -euo pipefail
          live_url="https://nahwerkconcierge.com/de/"
          ok=0
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${live_url}?qa=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if grep -q 'mechanism-video' <<<"$html" &&
               grep -q 'd2ol7oe51mr4n9.cloudfront.net' <<<"$html" &&
               grep -q 'updateMechanismVideo' <<<"$html"; then
              ok=1
              echo "STEWARO_SCROLL_VIDEO_LIVE_SOURCE=GREEN attempt=$attempt"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Desktop and mobile bidirectional scroll QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/stewaro-scroll-video-live-qa
          "$CHROME" --headless --no-sandbox --disable-gpu --remote-debugging-port=0 --user-data-dir=/tmp/stewaro-scroll-cdp about:blank >/tmp/stewaro-scroll-cdp.log 2>&1 &
          for attempt in $(seq 1 20); do
            test -s /tmp/stewaro-scroll-cdp/DevToolsActivePort && break
            sleep 1
          done
          if ! test -s /tmp/stewaro-scroll-cdp/DevToolsActivePort; then
            cat /tmp/stewaro-scroll-cdp.log || true
            exit 1
          fi
          CDP_PORT="$(head -n 1 /tmp/stewaro-scroll-cdp/DevToolsActivePort)"
          export CDP_PORT
          if ! curl -fsS "http://127.0.0.1:${CDP_PORT}/json/version" >/dev/null; then
            cat /tmp/stewaro-scroll-cdp.log || true
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const specs = [
            { name: 'desktop', width: 1440, height: 1000, mobile: false },
            { name: 'mobile', width: 390, height: 844, mobile: true }
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const cdpBase = 'http://127.0.0.1:' + process.env.CDP_PORT;

          async function createTarget() {
            const response = await fetch(cdpBase + '/json/new?about:blank', { method: 'PUT' });
            if (!response.ok) throw new Error('cdp_target_create_failed');
            return response.json();
          }

          async function connect(url) {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(url);
              ws.addEventListener('open', () => resolve(ws), { once: true });
              ws.addEventListener('error', () => reject(new Error('cdp_websocket_failed')), { once: true });
            });
          }

          async function audit(spec) {
            const target = await createTarget();
            const ws = await connect(target.webSocketDebuggerUrl);
            let seq = 0;
            const pending = new Map();
            const listeners = new Map();

            ws.addEventListener('message', (event) => {
              const message = JSON.parse(String(event.data));
              if (message.id && pending.has(message.id)) {
                const handler = pending.get(message.id);
                pending.delete(message.id);
                if (message.error) handler.reject(new Error(message.error.message || 'cdp_error'));
                else handler.resolve(message.result || {});
                return;
              }
              const queue = listeners.get(message.method);
              if (queue && queue.length) queue.shift()(message.params || {});
            });

            const send = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++seq;
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
            const waitEvent = (method) => new Promise((resolve) => {
              const queue = listeners.get(method) || [];
              queue.push(resolve);
              listeners.set(method, queue);
            });
            const evaluate = async (expression) => {
              const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              return result.result && result.result.value;
            };

            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride', {
              width: spec.width,
              height: spec.height,
              deviceScaleFactor: 1,
              mobile: spec.mobile,
              screenWidth: spec.width,
              screenHeight: spec.height
            });

            const loaded = waitEvent('Page.loadEventFired');
            await send('Page.navigate', {
              url: 'https://nahwerkconcierge.com/de/?qa=' + encodeURIComponent(process.env.GITHUB_SHA || '') + '&viewport=' + spec.name
            });
            await loaded;
            await sleep(500);

            let mediaReady = false;
            for (let i = 0; i < 40; i++) {
              mediaReady = await evaluate(`(() => {
                const v = document.querySelector('.mechanism-video');
                return Boolean(v && v.readyState >= 1 && Number.isFinite(v.duration) && v.duration > 0);
              })()`);
              if (mediaReady) break;
              await sleep(250);
            }
            if (!mediaReady) throw new Error('mechanism_video_metadata_not_ready:' + spec.name);

            // The homepage contains large cinematic media above this section. On a cold
            // browser run its document height can still grow briefly after load, which
            // causes scrollTo() to be clamped before the mechanism section is reachable.
            let stableLayoutReads = 0;
            let previousLayout = null;
            for (let i = 0; i < 50; i++) {
              const layout = await evaluate(`(() => {
                const section = document.querySelector('.precision');
                if (!section) return null;
                const rect = section.getBoundingClientRect();
                return {
                  scrollHeight: document.documentElement.scrollHeight,
                  sectionTop: scrollY + rect.top,
                  sectionHeight: rect.height
                };
              })()`);
              if (!layout) throw new Error('mechanism_section_missing:' + spec.name);
              const stable = previousLayout &&
                Math.abs(layout.scrollHeight - previousLayout.scrollHeight) < 2 &&
                Math.abs(layout.sectionTop - previousLayout.sectionTop) < 2 &&
                Math.abs(layout.sectionHeight - previousLayout.sectionHeight) < 2;
              stableLayoutReads = stable ? stableLayoutReads + 1 : 0;
              previousLayout = layout;
              if (stableLayoutReads >= 4) break;
              await sleep(150);
            }
            if (stableLayoutReads < 4) throw new Error('mechanism_layout_not_stable:' + spec.name);

            const sample = async (position) => {
              let target = null;
              for (let i = 0; i < 40; i++) {
                target = await evaluate(`(() => {
                  const section = document.querySelector('.precision');
                  const video = document.querySelector('.mechanism-video');
                  if (!section || !video) return null;
                  const rect = section.getBoundingClientRect();
                  const absoluteTop = scrollY + rect.top;
                  const y = ${JSON.stringify(position)} === 'early'
                    ? absoluteTop - innerHeight * 0.8
                    : absoluteTop + rect.height * 0.55;
                  const maxY = Math.max(0, document.documentElement.scrollHeight - innerHeight);
                  return { requestedY: Math.max(0, y), maxY, absoluteTop };
                })()`);
                if (!target) return null;
                if (target.requestedY <= target.maxY + 1) break;
                await sleep(150);
              }
              if (!target || target.requestedY > target.maxY + 1) {
                throw new Error('mechanism_scroll_target_unreachable:' + spec.name + ':' + JSON.stringify(target));
              }
              const command = await evaluate(`(() => {
                const section = document.querySelector('.precision');
                const rect = section.getBoundingClientRect();
                const absoluteTop = scrollY + rect.top;
                const y = ${JSON.stringify(position)} === 'early'
                  ? absoluteTop - innerHeight * 0.8
                  : absoluteTop + rect.height * 0.55;
                document.documentElement.style.setProperty('scroll-behavior', 'auto', 'important');
                if (document.body) document.body.style.setProperty('scroll-behavior', 'auto', 'important');
                window.scrollTo({ top: Math.max(0, y), left: 0, behavior: 'instant' });
                return { requestedY: Math.max(0, y), absoluteTop };
              })()`);
              if (!command) return null;
              for (let i = 0; i < 30; i++) {
                const actualY = await evaluate('scrollY');
                if (Math.abs(actualY - command.requestedY) < 2) return { ...command, actualY };
                await sleep(50);
              }
              const actualY = await evaluate('scrollY');
              throw new Error('mechanism_scroll_target_not_reached:' + spec.name + ':' +
                JSON.stringify({ requestedY: command.requestedY, actualY }));
            };
            const waitForMechanismReady = async () => {
              for (let i = 0; i < 30; i++) {
                const ready = await evaluate(`(() => {
                  const v = document.querySelector('.mechanism-video');
                  return Boolean(v && v.readyState >= 1 && Number.isFinite(v.duration) && v.duration > 0);
                })()`);
                if (ready) return;
                await sleep(100);
              }
              throw new Error('mechanism_video_not_ready_after_scroll:' + spec.name);
            };

            await sample('early');
            await waitForMechanismReady();
            await sleep(350);
            const early = await evaluate(`(() => {
              const section = document.querySelector('.precision');
              const video = document.querySelector('.mechanism-video');
              const rect = section.getBoundingClientRect();
              return { currentTime: video.currentTime, duration: video.duration, paused: video.paused, rectTop: rect.top, scrollY };
            })()`);

            await sample('late');
            await waitForMechanismReady();
            await sleep(350);
            const late = await evaluate(`(() => {
              const section = document.querySelector('.precision');
              const video = document.querySelector('.mechanism-video');
              const rect = section.getBoundingClientRect();
              return { currentTime: video.currentTime, duration: video.duration, paused: video.paused, rectTop: rect.top, scrollY };
            })()`);

            const shot = await send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false });
            fs.writeFileSync('/tmp/stewaro-scroll-video-live-qa/' + spec.name + '-late.png', Buffer.from(shot.data, 'base64'));

            await sample('early');
            await waitForMechanismReady();
            await sleep(350);
            const reverse = await evaluate(`(() => {
              const section = document.querySelector('.precision');
              const video = document.querySelector('.mechanism-video');
              const rect = section.getBoundingClientRect();
              return { currentTime: video.currentTime, duration: video.duration, paused: video.paused, rectTop: rect.top, scrollY };
            })()`);

            console.log('STEWARO_SCROLL_VIDEO_LIVE_QA', JSON.stringify({ spec, early, late, reverse }));

            if (!early || !late || !reverse) throw new Error('scroll_sample_missing:' + spec.name);
            if (!(late.currentTime > early.currentTime + 0.05)) throw new Error('scroll_forward_failed:' + spec.name);
            if (!(reverse.currentTime < late.currentTime - 0.05)) throw new Error('scroll_reverse_failed:' + spec.name);
            if (!early.paused || !late.paused || !reverse.paused) throw new Error('unexpected_autoplay:' + spec.name);
            if (!(late.duration > 0 && late.duration <= 12)) throw new Error('unexpected_duration:' + spec.name + ':' + late.duration);

            ws.close();
          }

          (async () => {
            for (const spec of specs) await audit(spec);
            console.log('STEWARO_SCROLL_VIDEO_LIVE_DESKTOP_MOBILE=GREEN');
          })().catch((error) => {
            console.error('STEWARO_SCROLL_VIDEO_LIVE_QA_FAIL', error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE

      - name: Upload live QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stewaro-scroll-video-live-qa
          path: /tmp/stewaro-scroll-video-live-qa/*.png
          if-no-files-found: warn
          retention-days: 7
