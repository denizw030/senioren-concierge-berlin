name: E-Mail provider button PR verify once

on:
  push:
    branches:
      - fix/email-provider-buttons-freeze-20260917

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check assets/email-provider-logo-connect-v3.js
      - name: Provider button contract
        run: node tests/email-provider-button-freeze-contract.test.mjs
      - name: Existing e-mail account regressions
        run: |
          if [ -f tests/email-account-integration.test.mjs ]; then node --test tests/email-account-integration.test.mjs; fi
          if [ -f tests/account-email-security.test.mjs ]; then node --test tests/account-email-security.test.mjs; fi
