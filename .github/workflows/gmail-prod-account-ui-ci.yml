name: Gmail PROD account UI CI

on:
  push:
    branches:
      - prod/gmail-account-cutover-20260915-1352
    paths:
      - 'assets/email-account-integration.js'
      - 'email-concierge.html'
      - 'tests/email-account-integration.test.mjs'
      - '.github/workflows/gmail-prod-account-ui-ci.yml'
  pull_request:
    paths:
      - 'assets/email-account-integration.js'
      - 'email-concierge.html'
      - 'tests/email-account-integration.test.mjs'
      - '.github/workflows/gmail-prod-account-ui-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check assets/email-account-integration.js
      - name: Gmail PROD unit contract
        run: node --test tests/email-account-integration.test.mjs
      - name: PROD Gmail contract guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('assets/email-account-integration.js').read_text()
          html = Path('email-concierge.html').read_text()
          assert 'WEBSITE_EMAIL_INTEGRATION_CONTRACT_V1' in js
          assert 'https://djicahhmnnamtjuqedqd.supabase.co/functions/v1/nahwerk-email-runtime' in js
          assert 'EMAIL_GATEWAY_BASE = null' not in js
          assert '/email/providers' in js and '/email/connection' in js
          assert '/email/connect' in js and '/email/reauth' in js and '/email/disconnect' in js
          assert 'accounts.google.com' in js
          assert 'scb_web_session' in js
          assert 'email_oauth=complete' in html
          assert '/konto.html' in html
          assert 'noindex,nofollow' in html
          print('GMAIL_PROD_ACCOUNT_UI=GREEN')
          PY
