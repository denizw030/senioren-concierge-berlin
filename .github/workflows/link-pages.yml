name: Link professional pages
on:
  push:
    paths:
      - '.github/workflows/link-pages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace anchor-only navigation with real pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'href="#top"':'href="index.html"',
            'href="#leistungen"':'href="leistungen.html"',
            'href="#pakete"':'href="pakete.html"',
            'href="#ablauf"':'href="ablauf.html"',
            'href="#ueber"':'href="ueber-mich.html"',
            'href="#faq"':'href="faq.html"',
            'href="#kontakt"':'href="kontakt.html"'
          }
          changed=False
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new)
                  changed=True
          if not changed:
              raise SystemExit('No target links found; index already patched or structure changed.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Startseite mit echten Unterseiten verknüpfen"
          git push
