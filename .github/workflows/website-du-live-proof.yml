name: NAHWERK Website Du Live Production Proof

on:
  push:
    branches:
      - verify/website-du-production-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Verify public production resources
        shell: bash
        run: |
          set -euo pipefail
          CB="du-final-${GITHUB_RUN_ID}"
          fetch(){ curl -fLsS --retry 6 --retry-delay 2 "$1" -o "$2"; }
          fetch "https://nahwerkconcierge.com/index.html?cb=$CB" /tmp/index.html
          fetch "https://nahwerkconcierge.com/anmelden.html?produkt=prime&cb=$CB" /tmp/anmelden.html
          fetch "https://nahwerkconcierge.com/registrieren.html?cb=$CB" /tmp/registrieren.html
          fetch "https://nahwerkconcierge.com/senioren-concierge.html?cb=$CB" /tmp/senioren.html
          grep -q 'Dein persönlicher Concierge' /tmp/index.html
          grep -q 'Sag, was du brauchst' /tmp/index.html
          grep -q 'Melde dich mit deiner E-Mail-Adresse' /tmp/anmelden.html
          grep -q 'id="loginForm"' /tmp/anmelden.html
          grep -q 'type="email"' /tmp/anmelden.html
          grep -q 'type="password"' /tmp/anmelden.html
          grep -Eq 'Für wen richtest du den Zugang ein\?|Wer darf dich begleiten\?' /tmp/registrieren.html
          grep -q '<form' /tmp/registrieren.html
          grep -q 'Sie müssen keine Befehle oder Fachbegriffe kennen.' /tmp/senioren.html
          grep -q 'Finden Sie eine Persönlichkeit, die zu Ihnen passt.' /tmp/senioren.html
          echo 'LIVE RESOURCE CONTRACT GREEN'

      - name: Real Chromium production proof
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p live-proof
          CB="du-final-${GITHUB_RUN_ID}"

          validate_dom(){
            file="$1"; kind="$2"
            grep -qi '<html' "$file" || return 1
            grep -qi '<body' "$file" || return 1
            case "$kind" in
              index)
                grep -q 'Dein persönlicher Concierge' "$file" && grep -q 'Sag, was du brauchst' "$file"
                ;;
              login)
                grep -q 'id="loginForm"' "$file" && grep -q 'type="email"' "$file" && grep -q 'type="password"' "$file" && grep -q 'Melde dich mit deiner E-Mail-Adresse' "$file"
                ;;
              register)
                grep -q '<form' "$file" && grep -Eq 'Für wen richtest du den Zugang ein\?|Wer darf dich begleiten\?' "$file"
                ;;
              senior)
                grep -q 'Sie müssen keine Befehle oder Fachbegriffe kennen.' "$file" && grep -q 'Finden Sie eine Persönlichkeit, die zu Ihnen passt.' "$file"
                ;;
            esac
          }

          case_run(){
            name="$1"; width="$2"; height="$3"; path="$4"; kind="$5"
            sep='?'; [[ "$path" == *'?'* ]] && sep='&'
            url="https://nahwerkconcierge.com/${path}${sep}cb=${CB}-${name}"
            echo "CASE $name START $url"
            ok=0
            for attempt in 1 2 3; do
              echo "CASE $name DOM ATTEMPT $attempt"
              rm -f "live-proof/$name-dom.html"
              if "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --window-size="$width,$height" --virtual-time-budget=8000 --dump-dom "$url" > "live-proof/$name-dom.html" 2>"live-proof/$name-dom-stderr-$attempt.log" && validate_dom "live-proof/$name-dom.html" "$kind"; then
                ok=1; break
              fi
              sleep 2
            done
            if [[ "$ok" != 1 ]]; then
              echo "CASE $name DOM CONTRACT RED"
              grep -Eo '<title>[^<]*|Dein persönlicher Concierge|Sag, was du brauchst|Melde dich mit deiner E-Mail-Adresse|Sie müssen keine Befehle oder Fachbegriffe kennen\.' "live-proof/$name-dom.html" | head -20 || true
              return 1
            fi
            shot=0
            for attempt in 1 2 3; do
              echo "CASE $name SCREENSHOT ATTEMPT $attempt"
              rm -f "live-proof/$name.png"
              if "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --hide-scrollbars --window-size="$width,$height" --virtual-time-budget=8000 --screenshot="live-proof/$name.png" "$url" >"live-proof/$name-shot-stdout-$attempt.log" 2>"live-proof/$name-shot-stderr-$attempt.log" && test -s "live-proof/$name.png"; then
                shot=1; break
              fi
              sleep 2
            done
            [[ "$shot" == 1 ]] || { echo "CASE $name SCREENSHOT RED"; return 1; }
            echo "CASE $name GREEN"
          }

          case_run index-1440x900 1440 900 index.html index
          case_run index-1366x768 1366 768 index.html index
          case_run index-1280x800 1280 800 index.html index
          case_run index-390x844 390 844 index.html index
          case_run index-360x800 360 800 index.html index
          case_run anmelden-1440x900 1440 900 'anmelden.html?produkt=prime' login
          case_run anmelden-390x844 390 844 'anmelden.html?produkt=prime' login
          case_run registrieren-1440x900 1440 900 registrieren.html register
          case_run registrieren-390x844 390 844 registrieren.html register
          case_run senioren-1440x900 1440 900 senioren-concierge.html senior
          case_run senioren-390x844 390 844 senioren-concierge.html senior
          echo 'REAL LIVE CHROMIUM MATRIX GREEN'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-du-live-production-proof
          path: live-proof/
          if-no-files-found: error
