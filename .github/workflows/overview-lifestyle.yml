name: overview lifestyle integration

# Canonical STEWARO pages are authored and reviewed on task branches.
# Legacy seed writers cannot regenerate these pages without restoring old branding.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: overview-lifestyle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical pages, localization and public branding
        run: >-
          node --test
          tests/overview-lifestyle.test.mjs
          tests/i18n-media-audit.test.mjs
          tests/i18n-design-parity.test.mjs
          tests/seo-indexing.test.mjs
          tests/stewaro-public-terminology.test.mjs
          tests/stewaro-canonical-validation-workflows.test.mjs
      - name: Validate clean diff
        run: git diff --check
