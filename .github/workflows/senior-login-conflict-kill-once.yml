name: senior login conflict kill once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/senior-login-conflict-kill-once.yml'

permissions:
  contents: write

concurrency:
  group: senior-login-conflict-kill-main
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neutralize legacy senior login preview rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/premium-preview.css')
          css = css_path.read_text()
          marker = 'SENIOR_LOGIN_CANONICAL_BRIDGE_V2'
          if marker not in css:
              css += r'''

/* SENIOR_LOGIN_CANONICAL_BRIDGE_V2
   Keep the senior login stable even if premium-preview.css is loaded after the canonical login stylesheet. */
html body.login-image-page.senior-product main>.hero,
html body.login-image-page.senior-product main>.section,
html body.login-image-page[data-product="senioren"] main>.hero,
html body.login-image-page[data-product="senioren"] main>.section{
  position:relative!important;
  z-index:2!important;
  display:block!important;
  width:50%!important;
  max-width:50%!important;
  min-width:0!important;
  min-height:0!important;
  margin:0!important;
  box-sizing:border-box!important;
  overflow:visible!important;
  background:transparent!important;
  content-visibility:visible!important;
  contain:none!important;
}
html body.login-image-page.senior-product main>.hero,
html body.login-image-page[data-product="senioren"] main>.hero{
  padding:clamp(46px,4.7vw,70px) clamp(38px,5.1vw,76px) 0!important;
}
html body.login-image-page.senior-product main>.section,
html body.login-image-page[data-product="senioren"] main>.section{
  padding:26px clamp(38px,5.1vw,76px) clamp(48px,5vw,72px)!important;
}
html body.login-image-page.senior-product main>.hero>.wrap,
html body.login-image-page.senior-product main>.section>.wrap,
html body.login-image-page.senior-product .loginwrap,
html body.login-image-page[data-product="senioren"] main>.hero>.wrap,
html body.login-image-page[data-product="senioren"] main>.section>.wrap,
html body.login-image-page[data-product="senioren"] .loginwrap{
  display:block!important;
  width:100%!important;
  max-width:560px!important;
  min-width:0!important;
  margin:0 auto!important;
  padding:0!important;
  box-sizing:border-box!important;
}
html body.login-image-page.senior-product main>.hero>.wrap>p,
html body.login-image-page[data-product="senioren"] main>.hero>.wrap>p{
  display:block!important;
  width:100%!important;
  max-width:560px!important;
  min-width:0!important;
  margin:0!important;
  padding:0!important;
  white-space:normal!important;
  word-break:normal!important;
  overflow-wrap:normal!important;
}
html body.login-image-page.senior-product main>.hero>.wrap>h1,
html body.login-image-page[data-product="senioren"] main>.hero>.wrap>h1{
  width:100%!important;
  max-width:560px!important;
  min-width:0!important;
}
html body.login-image-page.senior-product .logincard,
html body.login-image-page[data-product="senioren"] .logincard{
  display:block!important;
  width:100%!important;
  max-width:none!important;
  min-width:0!important;
  margin:0!important;
  box-sizing:border-box!important;
}
@media(max-width:820px){
  html body.login-image-page.senior-product main>.hero,
  html body.login-image-page.senior-product main>.section,
  html body.login-image-page[data-product="senioren"] main>.hero,
  html body.login-image-page[data-product="senioren"] main>.section{
    width:100%!important;
    max-width:100%!important;
  }
  html body.login-image-page.senior-product main>.hero,
  html body.login-image-page[data-product="senioren"] main>.hero{
    padding:38px 20px 0!important;
  }
  html body.login-image-page.senior-product main>.section,
  html body.login-image-page[data-product="senioren"] main>.section{
    padding:24px 20px 32px!important;
  }
}
'''
              css_path.write_text(css)

          js_path = Path('assets/site-ui.js')
          js = js_path.read_text()
          js = js.replace("premium.href = '/assets/premium-preview.css?v=1';", "premium.href = '/assets/premium-preview.css?v=2';")
          js_path.write_text(js)
          PY

      - name: Validate isolated result
        run: |
          grep -q 'SENIOR_LOGIN_CANONICAL_BRIDGE_V2' assets/premium-preview.css
          grep -q "premium-preview.css?v=2" assets/site-ui.js
          git diff --check

      - name: Publish without overwriting concurrent work
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/premium-preview.css assets/site-ui.js
          git commit -m "Fix senior login legacy CSS conflict"
          git pull --rebase origin main
          git push origin HEAD:main
