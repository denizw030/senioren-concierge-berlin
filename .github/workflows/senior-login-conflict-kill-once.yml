name: senior login conflict kill once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/senior-login-conflict-kill-once.yml'

permissions:
  contents: write

concurrency:
  group: senior-login-conflict-kill-main
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neutralize legacy senior login preview rules
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("assets/premium-preview.css"); t=p.read_text(); s=base64.b64decode("").decode(); p.write_text(t if "SENIOR_LOGIN_CANONICAL_BRIDGE_V2" in t else t+s)'
          python -c 'from pathlib import Path; p=Path("assets/site-ui.js"); t=p.read_text(); p.write_text(t.replace("premium.href = '\''/assets/premium-preview.css?v=1'\'';", "premium.href = '\''/assets/premium-preview.css?v=2'\'';"))'

      - name: Validate isolated result
        run: |
          grep -q 'SENIOR_LOGIN_CANONICAL_BRIDGE_V2' assets/premium-preview.css
          grep -q 'premium-preview.css?v=2' assets/site-ui.js
          git diff --check

      - name: Publish without overwriting concurrent work
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/premium-preview.css assets/site-ui.js
          git commit -m "Fix senior login legacy CSS conflict"
          git pull --rebase origin main
          git push origin HEAD:main
