name: Public Web Concierge v1

on:
  pull_request:
    paths:
      - "public-concierge.html"
      - "assets/public-concierge.css"
      - "assets/public-concierge.js"
      - "assets/public-concierge-policy.js"
      - "api/public-chat.js"
      - "docs/public-web-concierge-v1-contract.md"
      - "tests/public-web-concierge-v1.test.mjs"
      - ".github/workflows/public-web-concierge-v1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check public chat JavaScript
        run: |
          node --check api/public-chat.js
          node --check assets/public-concierge-policy.js
          node --check assets/public-concierge.js

      - name: Run Public Web Concierge provider-free matrix
        run: node --test tests/public-web-concierge-v1.test.mjs

      - name: Run existing website auth/security regression
        run: node --test tests/password-policy.test.mjs tests/auth-security.test.mjs

      - name: Enforce isolated public-chat scope
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=100 || true
          BASE_SHA="$(git merge-base "$BASE_REF" HEAD)"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"

          forbidden='^(index\.html|datenschutz\.html|pakete\.html|tests/website-launch-readiness-final\.test\.mjs|android-app/)'
          if printf '%s\n' "${changed[@]}" | grep -Eq "$forbidden"; then
            echo "Forbidden PR58/Android collision detected."
            exit 1
          fi

          allowed='^(public-concierge\.html|assets/public-concierge\.(css|js)|assets/public-concierge-policy\.js|api/public-chat\.js|docs/public-web-concierge-v1-contract\.md|tests/public-web-concierge-v1\.test\.mjs|\.github/workflows/public-web-concierge-v1-ci\.yml)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ ! "$path" =~ $allowed ]]; then
              echo "Unexpected file outside isolated public-chat scope: $path"
              exit 1
            fi
          done < <(printf '%s\n' "${changed[@]}")

      - name: Prove provider-free candidate has no provider target
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'api\.openai\.com|supabase\.co/functions|twilio|whatsapp.*graph\.facebook' \
            public-concierge.html assets/public-concierge.js assets/public-concierge-policy.js api/public-chat.js || {
              echo "Provider target/reference detected in executable public-chat candidate."
              exit 1
            }
