name: E-Mail Mobile UI Fix Once 2026-09-16

on:
  push:
    branches:
      - fix/email-mobile-ui-prod-20260916
    paths:
      - '.github/workflows/email-mobile-ui-fix-once-20260916.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-mobile-ui-prod-20260916

      - name: Patch E-Mail Concierge customer UI
        run: |
          python - <<'PY'
          from pathlib import Path
          cssp=Path('assets/email-concierge-product.css')
          css=cssp.read_text()
          old='.ecp-primary{appearance:none;border:0;border-radius:14px;padding:10px 15px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;background:currentColor;color:Canvas;min-width:82px}.ecp-primary:disabled{opacity:.45;cursor:not-allowed}'
          new='.ecp-primary{appearance:none;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 15px;font:inherit;font-size:.86rem;font-weight:650;cursor:pointer;background:linear-gradient(180deg,#2f7dff,#1765e8);color:#fff;min-width:96px;box-shadow:0 8px 20px rgba(23,101,232,.18);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}.ecp-primary:hover{filter:brightness(1.06);box-shadow:0 10px 24px rgba(23,101,232,.24)}.ecp-primary:active{transform:scale(.985)}.ecp-primary:focus-visible{outline:2px solid rgba(47,125,255,.7);outline-offset:2px}.ecp-primary:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none;transform:none}'
          assert old in css
          css=css.replace(old,new,1)
          old='.ecp-protection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ecp-protection{padding:12px;border-radius:14px;background:rgba(127,127,127,.05);border:1px solid rgba(127,127,127,.14)}'
          new='.ecp-protection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.ecp-protection{min-width:0;padding:12px;border-radius:14px;background:rgba(127,127,127,.05);border:1px solid rgba(127,127,127,.14);overflow:hidden}'
          assert old in css
          css=css.replace(old,new,1)
          old='@media(max-width:980px){.ecp-summary{grid-template-columns:repeat(3,1fr)}.ecp-layout{grid-template-columns:1fr}.ecp-protection-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:640px)'
          new='@media(max-width:980px){.ecp-summary{grid-template-columns:repeat(3,1fr)}.ecp-layout{grid-template-columns:1fr}.ecp-protection-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}@media(max-width:760px){.ecp-protection-grid{grid-template-columns:1fr}.ecp-chat-form{grid-template-columns:1fr}.ecp-primary{width:100%}.ecp-protection strong,.ecp-protection span{overflow-wrap:anywhere}}@media(max-width:640px)'
          assert old in css
          css=css.replace(old,new,1)
          cssp.write_text(css)

          jsp=Path('assets/email-account-integration.js')
          js=jsp.read_text()
          old='/assets/email-concierge-product.css?v=20260916-1'
          new='/assets/email-concierge-product.css?v=20260916-2'
          assert old in js
          js=js.replace(old,new,1)
          jsp.write_text(js)
          PY

      - name: Validate customer UI
        run: |
          node --test tests/email-concierge-product.test.mjs tests/email-account-integration.test.mjs
          python - <<'PY'
          from pathlib import Path
          css=Path('assets/email-concierge-product.css').read_text()
          js=Path('assets/email-account-integration.js').read_text()
          assert 'background:linear-gradient(180deg,#2f7dff,#1765e8)' in css
          assert '@media(max-width:760px)' in css
          assert '.ecp-protection-grid{grid-template-columns:1fr}' in css
          assert '/assets/email-concierge-product.css?v=20260916-2' in js
          print('EMAIL_MOBILE_UI=GREEN')
          PY

      - name: Commit patched source
        run: |
          git config user.name 'NAHWERK Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/email-concierge-product.css assets/email-account-integration.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(email): polish mobile protection and send button'
          git push origin HEAD:fix/email-mobile-ui-prod-20260916
