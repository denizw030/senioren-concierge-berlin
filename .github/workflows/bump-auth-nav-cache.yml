name: Bump auth nav cache
on:
  push:
    branches:
      - staging/website-concierge-voice-preview-01
    paths:
      - .github/workflows/bump-auth-nav-cache.yml
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/website-concierge-voice-preview-01
      - name: Update all HTML cache versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path(".").glob("*.html"):
              s=p.read_text()
              n=s.replace("auth-nav.js?v=28","auth-nav.js?v=29")
              if n!=s:
                  p.write_text(n)
          PY
          git config user.name "NAHWERK UX"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bump mobile navigation cache version"
          git push origin HEAD:staging/website-concierge-voice-preview-01
