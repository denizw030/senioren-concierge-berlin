name: Senior Login canonical reset once

on:
  push:
    branches:
      - fix/senior-login-canonical-reset-20260915

permissions:
  contents: write

concurrency:
  group: senior-login-canonical-reset-20260915
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/senior-login-canonical-reset-20260915
          fetch-depth: 0

      - name: Replace legacy senior login stylesheet stack
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('anmelden.html')
          text = path.read_text(encoding='utf-8')

          legacy = (
              '<link rel="stylesheet" href="/assets/senior-login-final-v1.css?v=4">'
              '<link rel="stylesheet" href="/assets/senior-login-canonical-20260915.css?v=2">'
              '<link rel="stylesheet" href="/assets/senior-login-stable-20260915.css?v=2" data-nw-senior-login-stable>'
          )
          canonical = '<link rel="stylesheet" href="/assets/senior-login-canonical-reset-20260915.css?v=1" data-nw-senior-login-stable>'

          if legacy in text:
              text = text.replace(legacy, canonical, 1)
          elif canonical not in text:
              raise SystemExit('Expected legacy senior-login stylesheet stack not found; refusing blind rewrite')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate isolated login contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('anmelden.html').read_text(encoding='utf-8')
          css = Path('assets/senior-login-canonical-reset-20260915.css').read_text(encoding='utf-8')

          required_html = [
              'id="loginForm"', 'id="loginEmail"', 'id="loginPassword"',
              'id="loginSubmit"', 'id="mfaChoice"', 'id="mfaStep"',
              'id="mfaRecovery"', 'id="forgotPassword"',
              '/assets/locale-boot.js?v=8',
              '/assets/senior-login-canonical-reset-20260915.css?v=1',
              'data-nw-senior-login-stable',
          ]
          for token in required_html:
              if token not in html:
                  raise SystemExit(f'missing required login contract token: {token}')

          forbidden = [
              '/assets/senior-login-final-v1.css?v=4',
              '/assets/senior-login-canonical-20260915.css?v=2',
              '/assets/senior-login-stable-20260915.css?v=2',
          ]
          for token in forbidden:
              if token in html:
                  raise SystemExit(f'legacy senior login stylesheet still linked: {token}')

          required_css = [
              'grid-template-columns:minmax(0,45%) minmax(0,55%)',
              'max-width:440px',
              'height:56px',
              '/cover no-repeat',
              'senior-woman-overview.webp',
          ]
          for token in required_css:
              if token not in css:
                  raise SystemExit(f'missing canonical CSS invariant: {token}')

          print('SENIOR_LOGIN_CANONICAL_RESET=GREEN')
          print('AUTH_CONTRACT_PRESERVED=GREEN')
          print('LEGACY_LOGIN_CSS_LINKS=0')
          PY

      - name: Commit branch-only rewrite if needed
        shell: bash
        run: |
          if git diff --quiet -- anmelden.html; then
            echo "No branch rewrite needed."
            exit 0
          fi
          git config user.name "nahwerk-prod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add anmelden.html
          git commit -m "[skip ci] senior login: switch to one canonical stylesheet"
          git push origin HEAD:fix/senior-login-canonical-reset-20260915
