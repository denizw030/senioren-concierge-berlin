name: Generate runtime-aligned website voice previews

on:
  push:
    branches:
      - staging/website-concierge-voice-preview-01
    paths:
      - .github/workflows/runtime-voice-preview.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/website-concierge-voice-preview-01

      - name: Generate all 23 runtime-aligned samples
        shell: bash
        run: |
          set -euo pipefail
          base="https://btqklftjmwtqqqdmwlnk.supabase.co/functions/v1/nw-voice-runtime-preview-20260829/runtimePreview-23-20260829"
          mkdir -p assets/concierges/voice-samples
          keys="nilo mira lena lukas hartmut frida asha sari leyla noor sofia camille anna olena mei amara kwame zuri jabari arjun wei yuki ren"

          for key in $keys; do
            out="assets/concierges/voice-samples/$key.mp3"
            echo "Generating $key"
            curl --fail --silent --show-error --location --retry 1 "$base/$key" -o "$out"
            test -s "$out"
            size=$(wc -c < "$out")
            if [ "$size" -lt 20000 ]; then
              echo "$key sample unexpectedly small: $size" >&2
              exit 1
            fi
            echo "$key $size bytes"
          done

      - name: Commit aligned samples
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NAHWERK Voice Preview"
          git config user.email "actions@users.noreply.github.com"
          git add assets/concierges/voice-samples/*.mp3
          git commit -m "Align website voice samples with published runtime"
          git push origin HEAD:staging/website-concierge-voice-preview-01
