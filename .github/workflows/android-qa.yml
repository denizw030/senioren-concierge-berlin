name: Android QA

on:
  push:
    branches:
      - codex/nahwerk-android-foundation
      - staging/nw-android-real-concierge-memory-01
    paths:
      - 'android-app/**'
      - '.github/workflows/android-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Verify Gradle wrapper files
        shell: bash
        run: |
          test -f ./gradlew
          test -f ./gradlew.bat
          test -f ./gradle/wrapper/gradle-wrapper.properties
          test -f ./gradle/wrapper/gradle-wrapper.jar
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile, test, lint and build debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nahwerk-real-concierge-staging-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nahwerk-real-concierge-staging-lint
          path: android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
