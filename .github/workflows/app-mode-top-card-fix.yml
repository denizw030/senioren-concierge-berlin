name: App Mode Top Card Fix

on:
  push:
    branches:
      - app-intelligence-modes-prod-v1
    paths:
      - '.github/workflows/app-mode-top-card-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-intelligence-modes-prod-v1
      - name: Keep start card synchronized with authoritative mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/nahwerk/concierge/AppProdGatewaySurface.kt')
          s = p.read_text()
          old = '"Concierge-Modus: ${if (snapshot.intelligenceMode == "SMART") "Intelligent" else "Günstig"}",'
          new = '"Concierge-Modus: ${if ((intelligenceMode?.mode ?: snapshot.intelligenceMode) == "SMART") "Intelligent" else "Günstig"}",'
          if old not in s:
              if new in s:
                  print('already patched')
                  raise SystemExit(0)
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          print('APP_MODE_TOP_CARD_FIX=GREEN')
          PY
      - name: Commit isolated branch fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'NAHWERK PROD Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android-app/app/src/main/java/com/nahwerk/concierge/AppProdGatewaySurface.kt
          git commit -m 'fix: keep Android home mode display authoritative'
          git push origin HEAD:app-intelligence-modes-prod-v1
