name: NAHWERK Anmelden Hero Fit Live Proof

on:
  push:
    branches:
      - verify/anmelden-hero-fit-production-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify live production resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-proof
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' 'https://nahwerkconcierge.com/anmelden.html?produkt=prime&hero_fit_proof=20260910' -o live-proof/anmelden-live.html
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' 'https://nahwerkconcierge.com/assets/nahwerk-logo-v2.css?hero_fit_proof=20260910' -o live-proof/nahwerk-logo-v2-live.css
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' 'https://nahwerkconcierge.com/assets/prime/nahwerk-red-blue-hero-web-lossless.webp?hero_fit_proof=20260910' -o live-proof/hero-live.webp
          grep -q 'nahwerk-red-blue-hero-web-lossless.webp' live-proof/nahwerk-logo-v2-live.css
          grep -q 'background-size:cover' live-proof/nahwerk-logo-v2-live.css
          grep -q 'background-position:center 18%' live-proof/nahwerk-logo-v2-live.css
          grep -q 'overflow:hidden' live-proof/nahwerk-logo-v2-live.css
          test -s live-proof/hero-live.webp
          echo 'LIVE RESOURCE CONTRACT GREEN'

      - name: Capture live Chromium screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          capture(){
            name="$1"; width="$2"; height="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size="$width,$height" --virtual-time-budget=5000 \
              --screenshot="live-proof/live-prime-$name.png" \
              "https://nahwerkconcierge.com/anmelden.html?produkt=prime&hero_fit_proof=20260910-$name"
            test -s "live-proof/live-prime-$name.png"
            echo "LIVE SCREENSHOT $name GREEN"
          }
          capture 1440x900 1440 900
          capture 1366x768 1366 768
          capture 1280x800 1280 800
          capture 390x844 390 844
          capture 360x800 360 800

      - uses: actions/upload-artifact@v4
        with:
          name: anmelden-hero-fit-live-proof
          path: live-proof/
          if-no-files-found: error
