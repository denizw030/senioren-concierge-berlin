name: Age-cast senior voice candidates

on:
  push:
    branches:
      - staging/website-concierge-voice-preview-01
    paths:
      - .github/workflows/age-voice-candidates.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/website-concierge-voice-preview-01
      - name: Evaluate all senior candidates
        shell: bash
        run: |
          set -euo pipefail
          base="https://btqklftjmwtqqqdmwlnk.supabase.co/functions/v1/nw-voice-age-candidate-20260829/castSenior-4mQ8xP2v"
          mkdir -p /tmp/voice-age-qa
          : > /tmp/voice-age-qa/results.txt

          for key in hartmut frida; do
            for variant in 0 1 2; do
              wav="/tmp/voice-age-qa/${key}-${variant}.wav"
              json="/tmp/voice-age-qa/${key}-${variant}.json"
              curl --fail --silent --show-error --location                 "$base/generate/${key}/${variant}" -o "$wav"
              curl --fail --silent --show-error --location                 -X POST -H "content-type: audio/wav" --data-binary "@$wav"                 "$base/evaluate/${key}/${variant}" -o "$json"
              age=$(jq -r '.perceived_age // 0' "$json")
              senior=$(jq -r '.senior_fit // 0' "$json")
              natural=$(jq -r '.naturalness // 0' "$json")
              persona=$(jq -r '.persona_fit // 0' "$json")
              voice=$(jq -r '.voice // "unknown"' "$json")
              echo "${key} variant=${variant} voice=${voice} perceived_age=${age} senior_fit=${senior} naturalness=${natural} persona_fit=${persona}" | tee -a /tmp/voice-age-qa/results.txt
            done
          done

          cat /tmp/voice-age-qa/results.txt
