name: NAHWERK Account Safety Senior Gap Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-safety-senior-gap-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify account safety UI and senior section background
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          konto=Path("konto.html").read_text(encoding="utf-8")
          senior=Path("senioren-concierge.html").read_text(encoding="utf-8")

          assert konto.count('id="ownerName"') == 1
          assert 'class="card summary-card owner-summary"' not in konto
          assert 'class="account-setup-by"' in konto
          assert 'id="safetyEnabled"' in konto
          assert 'class="safety-switch-track"' in konto
          assert 'id="safetyToggleLabel">Aktivieren' in konto
          assert 'safetyToggleLabel.textContent = enabled ? "Deaktivieren" : "Aktivieren"' in konto
          assert 'addEventListener("change"' in konto
          assert '>Uhrzeit</label>' in konto
          assert 'aria-label="Uhrzeit einstellen"' in konto
          assert 'Check-ins aktivieren' not in konto
          assert 'Check-in-Uhrzeit' not in konto
          assert 'Check-ins sind derzeit ausgeschaltet.' not in konto
          assert 'Check-ins sind aktiviert.' not in konto
          assert 'Nächster Check-in:' not in konto
          assert 'Sicherheit und Vertrauenskontakt.' in konto
          assert 'document.getElementById("ownerMeta")' not in konto

          # Technical backend field names remain intact.
          assert 's.checkin_times' in konto
          assert 's.next_checkin_at' in konto
          assert 's.safety_enabled === true' in konto

          # Senior page override must come after shared styles and only change main base.
          brand_idx=senior.index('assets/brand-2026.css')
          main_fix_idx=senior.index('body.senior-product > main')
          assert main_fix_idx > brand_idx
          assert 'body.senior-product > main {' in senior
          assert 'background: #f7f3ea !important;' in senior

          # Extract inline scripts for syntax check.
          scripts=[]
          start=0
          while True:
              i=konto.find("<script>",start)
              if i<0: break
              j=konto.find("</script>",i)
              if j<0: raise SystemExit("unterminated script")
              scripts.append(konto[i+8:j])
              start=j+9
          Path("/tmp/konto-inline.js").write_text("\n".join(scripts),encoding="utf-8")

          print("OWNER_LABEL_MOVE=GREEN")
          print("SAFETY_SWITCH=GREEN")
          print("CUSTOMER_CHECKIN_WORDING_REMOVED=GREEN")
          print("SAFETY_TECHNICAL_FIELDS_PRESERVED=GREEN")
          print("SENIOR_MAIN_BASE=GREEN")
          PY
          node --check /tmp/konto-inline.js
      - name: Run relevant regression tests
        run: |
          node --test tests/account-usage.test.mjs
          node --test tests/auth-security.test.mjs
