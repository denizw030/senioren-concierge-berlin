name: Local Intelligence Provider Restaurant Tests
on:
  push:
    branches:
      - design/nahwerk-local-provider-restaurant-02
  pull_request:
    branches:
      - design/nahwerk-local-intelligence-core-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Local Intelligence tests
        run: python -m unittest discover -s tests -v
