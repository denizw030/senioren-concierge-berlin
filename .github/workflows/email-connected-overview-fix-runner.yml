name: E-Mail connected overview one-shot fix

on:
  push:
    branches:
      - fix/email-connected-overview-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-connected-overview-20260917
          fetch-depth: 0
      - name: Patch only E-Mail customer UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          product = "assets/email-concierge-product.js"
          replace_once(
              product,
              '      accountRoot.appendChild(host);',
              '      const accountHead = accountRoot.querySelector(".email-account-head");\n'
              '      if (accountHead) accountHead.insertAdjacentElement("afterend", host);\n'
              '      else accountRoot.prepend(host);'
          )

          old_state = (
              '  async function setConnectionState(isConnected) {\n'
              '    connected = isConnected === true;\n'
              '    ensureHost();\n'
              '    if (!connected) { dashboard = null; chatMessages = []; render(); return; }\n'
              '    await loadDashboard();\n'
              '  }'
          )
          new_state = (
              '  function canonicalGoogleConnection(rows = globalThis.__nahwerkEmailConnections) {\n'
              '    if (!Array.isArray(rows)) return null;\n'
              '    return rows.some((row) => String(row?.provider || "").toUpperCase() === "GOOGLE" && String(row?.state || row?.status || "").toUpperCase() === "CONNECTED");\n'
              '  }\n'
              '  async function setConnectionState(isConnected) {\n'
              '    const canonical = canonicalGoogleConnection();\n'
              '    connected = canonical === null ? isConnected === true : canonical;\n'
              '    ensureHost();\n'
              '    if (!connected) { dashboard = null; chatMessages = []; render(); return; }\n'
              '    await loadDashboard();\n'
              '  }'
          )
          replace_once(product, old_state, new_state)

          old_export = (
              '  globalThis.NAHWERKEmailConciergeProduct = Object.freeze({\n'
              '    setConnectionState,\n'
              '    refresh() { return loadDashboard(false); }\n'
              '  });'
          )
          new_export = (
              '  window.addEventListener("nahwerk:email-connections-updated", (event) => {\n'
              '    const rows = Array.isArray(event.detail?.connections) ? event.detail.connections : globalThis.__nahwerkEmailConnections;\n'
              '    const canonical = canonicalGoogleConnection(rows);\n'
              '    if (canonical !== null) void setConnectionState(canonical);\n'
              '  });\n'
              '  globalThis.NAHWERKEmailConciergeProduct = Object.freeze({\n'
              '    setConnectionState,\n'
              '    refresh() { return loadDashboard(false); }\n'
              '  });'
          )
          replace_once(product, old_export, new_export)

          multi = "assets/email-multi-account-concierge-v1.js"
          old_multi = (
              '      const shell = document.getElementById("emailLogoConnectShell");\n'
              '      (shell?.parentElement || accountRoot).insertBefore(host, shell?.nextSibling || null);'
          )
          new_multi = (
              '      const product = document.getElementById("emailConciergeProduct");\n'
              '      const accountHead = accountRoot.querySelector(".email-account-head");\n'
              '      if (product?.parentElement === accountRoot) product.insertAdjacentElement("afterend", host);\n'
              '      else if (accountHead) accountHead.insertAdjacentElement("afterend", host);\n'
              '      else accountRoot.prepend(host);'
          )
          replace_once(multi, old_multi, new_multi)

          test_path = Path("tests/email-concierge-product.test.mjs")
          test_text = test_path.read_text()
          marker = 'test("connected account overview is topmost and follows canonical provider status"'
          if marker not in test_text:
              test_text += (
                  '\n\ntest("connected account overview is topmost and follows canonical provider status",()=>{\n'
                  '  const multi=fs.readFileSync("assets/email-multi-account-concierge-v1.js","utf8");\n'
                  '  assert.match(js,/accountRoot\\.querySelector\\("\\.email-account-head"\\)/);\n'
                  '  assert.match(js,/accountHead\\.insertAdjacentElement\\("afterend", host\\)/);\n'
                  '  assert.match(js,/__nahwerkEmailConnections/);\n'
                  '  assert.match(js,/nahwerk:email-connections-updated/);\n'
                  '  assert.match(js,/canonicalGoogleConnection/);\n'
                  '  assert.match(multi,/emailConciergeProduct/);\n'
                  '  assert.match(multi,/accountRoot\\.querySelector\\("\\.email-account-head"\\)/);\n'
                  '  assert.doesNotMatch(multi,/emailLogoConnectShell/);\n'
                  '});\n'
              )
              test_path.write_text(test_text)
          PY
      - name: Validate E-Mail-only patch
        shell: bash
        run: |
          node --check assets/email-concierge-product.js
          node --check assets/email-multi-account-concierge-v1.js
          node --test tests/email-concierge-product.test.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$(printf '%s\n' assets/email-concierge-product.js assets/email-multi-account-concierge-v1.js tests/email-concierge-product.test.mjs | sort)"
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/email-concierge-product.js assets/email-multi-account-concierge-v1.js tests/email-concierge-product.test.mjs
          git commit -m "fix(email): restore connected overview after linking account"
          git push origin HEAD:fix/email-connected-overview-20260917
