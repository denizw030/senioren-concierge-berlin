name: Email Provider Logo V3 Wire Once

on:
  push:
    branches:
      - fix/email-provider-logo-connect-v3-20260916
    paths:
      - '.github/workflows/email-provider-logo-v3-wire-once.yml'

permissions:
  contents: write

jobs:
  validate-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate customer provider UI
        run: |
          set -euo pipefail
          node --check assets/email-provider-logo-connect-v3.js
          grep -q 'data-logo-provider' assets/email-provider-logo-connect-v3.js
          grep -q 'Gmail' assets/email-provider-logo-connect-v3.js
          grep -q 'Yahoo Mail' assets/email-provider-logo-connect-v3.js
          grep -q 'Outlook' assets/email-provider-logo-connect-v3.js
          grep -q 'iCloud Mail' assets/email-provider-logo-connect-v3.js
          grep -q 'GMX' assets/email-provider-logo-connect-v3.js
          grep -q 'WEB.DE' assets/email-provider-logo-connect-v3.js
          grep -q 'Telekom Mail' assets/email-provider-logo-connect-v3.js
          grep -q 'Fastmail' assets/email-provider-logo-connect-v3.js
          grep -q 'Zoho Mail' assets/email-provider-logo-connect-v3.js
          grep -q 'IONOS' assets/email-provider-logo-connect-v3.js
          grep -q 'STRATO' assets/email-provider-logo-connect-v3.js
          ! grep -q 'IMAP-Host' assets/email-provider-logo-connect-v3.js
          ! grep -q 'SMTP-Host' assets/email-provider-logo-connect-v3.js
          ! grep -q 'IMAP-Port' assets/email-provider-logo-connect-v3.js
          ! grep -q 'SMTP-Port' assets/email-provider-logo-connect-v3.js
          ! grep -q 'sendMail' assets/email-provider-logo-connect-v3.js
          ! grep -q 'email.send' assets/email-provider-logo-connect-v3.js
          ! grep -Eq 'localStorage.*(secret|password|Passwort)' assets/email-provider-logo-connect-v3.js
          grep -q '#accountEmailCard #emailGenericForm' assets/email-provider-logo-connect-v3.css
          echo 'LOGO_PROVIDER_CUSTOMER_UI=GREEN'
          echo 'VISIBLE_IMAP_SMTP_FIELDS=0'
          echo 'SEND_ACTIONS=0'
      - name: Wire V3 assets into account page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('konto.html')
          s=p.read_text()
          css='    <link rel="stylesheet" href="assets/email-provider-logo-connect-v3.css?v=20260916-1" />\n'
          anchor='    <link rel="stylesheet" href="assets/email-account-integration.css?v=2" />\n'
          if css not in s:
              assert s.count(anchor)==1
              s=s.replace(anchor,anchor+css,1)
          old='  <script src="assets/email-provider-ui-v2.js?v=20260916-1"></script>'
          new='  <script src="assets/email-provider-logo-connect-v3.js?v=20260916-1"></script>'
          assert s.count(old)==1 or new in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q 'email-provider-logo-connect-v3.css?v=20260916-1' konto.html
          grep -q 'email-provider-logo-connect-v3.js?v=20260916-1' konto.html
          ! grep -q 'email-provider-ui-v2.js?v=20260916-1' konto.html
          git diff --check
      - name: Commit branch-only wiring
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'denizw030'
          git config user.email 'denizwnm@gmail.com'
          git add konto.html
          git commit -m 'feat(email): activate logo-first provider connection UI'
          git push origin HEAD:fix/email-provider-logo-connect-v3-20260916
          echo 'ACCOUNT_LOGO_PROVIDER_UI_WIRING=GREEN'
