name: Refresh discovery and registration assets
on:
  push:
    branches: [staging/website-concierge-voice-preview-01]
    paths: [.github/workflows/refresh-discovery-assets.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/website-concierge-voice-preview-01
      - name: Bump asset versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          repl={
            "brand-2026.css?v=18":"brand-2026.css?v=19",
            "concierge-overview.css?v=8":"concierge-overview.css?v=9",
            "concierge-overview.js?v=5":"concierge-overview.js?v=6",
            "onboarding.js?v=14":"onboarding.js?v=15",
          }
          for p in Path(".").glob("*.html"):
            s=p.read_text()
            n=s
            for a,b in repl.items(): n=n.replace(a,b)
            if n!=s: p.write_text(n)
          PY
          git config user.name "NAHWERK UX"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git commit -m "Refresh concierge discovery and registration assets"
          git pull --rebase origin staging/website-concierge-voice-preview-01
          git push origin HEAD:staging/website-concierge-voice-preview-01
