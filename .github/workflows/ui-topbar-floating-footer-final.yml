name: UI topbar floating footer final

on:
  push:
    branches:
      - ui/topbar-floating-footer-final-20260917
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/topbar-floating-footer-final-20260917
      - name: Apply scoped UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/site.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* NAHWERK TOPBAR FLOATING FOOTER FINAL 2026-09-17 */'
          block = r'''
/* NAHWERK TOPBAR FLOATING FOOTER FINAL 2026-09-17 */
html body .top .brand .mark,
html body .top .brand .mark.nahwerk-mark{
  width:40px!important;
  height:40px!important;
  flex:0 0 40px!important;
  box-shadow:none!important;
  transform:none!important;
}
html body .top .brand{
  min-width:0!important;
  gap:10px!important;
}
html body .top .links .nw-account-link,
html body .nw-account-link,
html body .nw-account-mobile{
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  padding:5px 6px!important;
}
html body .nw-account-link:hover,
html body .top .links .nw-account-link:hover,
html body .nw-account-mobile:hover{
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
}
html body .nw-account-avatar{
  width:29px!important;
  height:29px!important;
  flex:0 0 29px!important;
  border:0!important;
  border-radius:50%!important;
  background:#fff!important;
  color:#111!important;
  box-shadow:none!important;
}
html body .nw-account-logout,
html body .nw-account-cluster-mobile .nw-account-logout{
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  transform:none!important;
}
html body .nw-account-logout:hover,
html body .nw-account-cluster-mobile .nw-account-logout:hover{
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  transform:none!important;
}
html body .nw-language-button,
html body .top .nav .nw-language-button,
html body .top .links .nw-language-button{
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
html body .nw-language-button:hover,
html body .nw-language-button:focus-visible{
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
}
html body .top .nav-toggle{
  width:52px!important;
  height:48px!important;
  padding:6px 8px!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
}
html body .top .nav-toggle span{
  width:34px!important;
  height:3px!important;
  margin:6px auto!important;
  border-radius:999px!important;
}
body:not(.nw-portal-light) .footer,
body:not(.nw-portal-light).senior-product .footer,
body:not(.nw-portal-light)[data-product="senioren"] .footer{
  background:#000!important;
  background-image:none!important;
}
.nw-floating-concierge-icon{
  display:grid!important;
  place-items:center!important;
  width:30px!important;
  height:30px!important;
  border-radius:0!important;
  background:transparent!important;
}
.nw-floating-concierge-icon img{
  display:block!important;
  width:28px!important;
  height:28px!important;
  object-fit:contain!important;
}
@media(max-width:620px){
  html body .top .brand .mark,
  html body .top .brand .mark.nahwerk-mark{
    width:38px!important;
    height:38px!important;
    flex-basis:38px!important;
  }
}
'''.strip()
          if marker not in css:
              css = css.rstrip() + '\n\n' + block + '\n'
              css_path.write_text(css, encoding='utf-8')

          js_path = Path('assets/auth-nav.js')
          js = js_path.read_text(encoding='utf-8')
          old = '''link.innerHTML = '<span class="nw-floating-concierge-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6.8A2.8 2.8 0 0 1 7.8 4h8.4A2.8 2.8 0 0 1 19 6.8v5.9a2.8 2.8 0 0 1-2.8 2.8h-4.7L7 19v-3.5A2.8 2.8 0 0 1 5 12.8Z"></path><path d="M9 9h6M9 12h4"></path></svg></span><span>Concierge</span>';'''
          new = '''link.innerHTML = '<span class="nw-floating-concierge-icon" aria-hidden="true"><img src="/assets/logos/NAHWERK-Goldmann-Logo.svg" alt="" /></span><span>Concierge</span>';'''
          if old in js:
              js = js.replace(old, new, 1)
              js_path.write_text(js, encoding='utf-8')
          elif new not in js:
              raise SystemExit('floating concierge markup anchor not found')
          PY
      - name: Commit scoped changes
        shell: bash
        run: |
          git config user.name "nahwerk-ui-final-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/site.css assets/auth-nav.js
          if git diff --cached --quiet; then
            echo "No scoped changes required."
            exit 0
          fi
          git commit -m "Finalize top bar, floating concierge and dark footer"
          git push origin HEAD
