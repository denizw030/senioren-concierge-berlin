name: Update homepage accent color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/darken-red.yml'

permissions:
  contents: write

jobs:
  update-color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old red with dark garnet on homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('#b40d14', '#6f1018')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change if needed
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Switch homepage red to dark garnet"
          git push
