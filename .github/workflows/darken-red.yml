name: Temporary Worldwide Registered Regression Diagnostic

on:
  push:
    branches:
      - fix/nahwerk-weltweit-navigation-rename-final-20260910
    paths:
      - '.github/workflows/darken-red.yml'

permissions:
  contents: read

jobs:
  branch-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact branch Node regression
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > branch-node-regression.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> branch-node-regression.log
          cat branch-node-regression.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: worldwide-node-regression-branch
          path: branch-node-regression.log

  fresh-main-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5112c085938c0b892e7090442f03911a4b7f6131
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact fresh-main Node regression
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > fresh-main-node-regression.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> fresh-main-node-regression.log
          cat fresh-main-node-regression.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: worldwide-node-regression-fresh-main
          path: fresh-main-node-regression.log
